sonar.projectKey=eagle-fusion
sonar.projectName=eagle-fusion
sonar.projectVersion=0.0.1
# Sources and tests
sonar.sources=src,library,project
sonar.tests=src,library,project
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.spec.ts,\
  **/*.mock.ts,\
  **/e2e/**,\
  **/docs/**,\
  **/.angular/**,\
  src/environments/**,\
  src/**/*.module.ts,\
  src/**/mocks/*.ts,\
  src/**/index.ts,\
  src/main.ts,\
  src/main.server.ts,\
  src/polyfills.ts,\
  src/server.polyfills.ts,\
  src/test-import.ts,\
  project/**/*.spec.ts,\
  project/**/*.model.ts,\
  project/**/*.module.ts,\
  library/**/*.spec.ts,\
  library/**/*.model.ts,\
  library/**/*.module.ts,\
  **/*-api.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# SCM — disable git blame to avoid changeset write failures on large repos
sonar.scm.disabled=true

# ESLint report import removed — SonarQube 25.x runs its own internal ESLint bridge
# and importing an external report causes zero-length range conflicts with native analysis
