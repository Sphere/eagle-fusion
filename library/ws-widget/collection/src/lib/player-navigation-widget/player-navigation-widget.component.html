<div class="parent">
  <button mat-button class="child prev-btn" (click)="navigateToPreResource()" [disabled]="!prevResourceUrl">
    <img class="mr-2"
      [src]="isPlayBackBtnClicked || !prevResourceUrl ? 'fusion-assets/icons/play-back-clicked.svg' : 'fusion-assets/icons/play-back.svg'"
      alt="previous">
    <span i18n>Previous</span>
  </button>
  <button mat-button class="child next-btn" (click)="navigateToNextResource()" [disabled]="!isProgressCheck">
    <span i18n>Next</span>
    <img class="ml-2"
      [src]="isProgressCheck ? 'fusion-assets/icons/play-next-clicked.svg' : 'fusion-assets/icons/play-next.svg'"
      alt="next">
  </button>
</div>
