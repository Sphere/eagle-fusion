<button name="content-share-button" mat-icon-button matTooltip="Share Content"
  *ngIf="!isTocBanner && isShareEnabled && widgetData && !showText && showBtn" (click)="shareContent()"
  [disabled]="isDisabled" class="action-button" id="share-icon">
  <img loading="lazy" src="/fusion-assets/icons/share.png" class="action-icons" alt="Share" />
</button>
<button name="content-share-button" mat-icon-button matTooltip="Share Content"
  *ngIf="isTocBanner && isShareEnabled && widgetData && !showText && showBtn" (click)="shareContent()"
  [disabled]="isDisabled" class="action-button-toc" id="share-icon">
  <img alt="logo" loading="lazy"
    [src]='!isDark ?  "./fusion-assets/icons/share.svg" : "./fusion-assets/icons/share-dark.svg"'>
</button>

<button name="content-share-button" mat-button matTooltip="Share Content"
  *ngIf="isShareEnabled && widgetData && showText && showBtn" (click)="shareContent()" [disabled]="isDisabled">
  <mat-icon class="mr-2">share</mat-icon>
  <span class="text-base font-normal">Share</span>
</button>
