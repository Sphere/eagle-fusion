<!-- Modal Header -->
<div class="share-header">
  <div class="share-title">{{ data?.content?.name }}</div>
  <button class="share-close" [mat-dialog-close]="false">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div *ngIf="isSocialMediaShareEnabled" class="share-body">
  <!-- Social section -->
  <p class="share-section-label">Share on Social Media</p>
  <div class="share-social-row">
    <ws-widget-btn-facebook-share [url]="detailUrl"></ws-widget-btn-facebook-share>
    <ws-widget-btn-twitter-share [url]="detailUrl" [message]="message"></ws-widget-btn-twitter-share>
    <ws-widget-btn-linkedin-share [url]="detailUrl"></ws-widget-btn-linkedin-share>
    <ws-widget-btn-whatsapp-share [url]="detailUrl"></ws-widget-btn-whatsapp-share>
  </div>

  <div class="share-divider"></div>

  <!-- QR section -->
  <p class="share-section-label">Scan to Share</p>
  <div class="share-qr-row">
    <div class="share-qr-wrap">
      <qrcode #code [qrdata]="qrdata" [width]="130" [errorCorrectionLevel]="'M'" [elementType]="'svg'"></qrcode>
    </div>
    <button class="share-download-btn" (click)="saveAsImage(code)">
      <mat-icon>file_download</mat-icon>
      <span>Download QR</span>
    </button>
  </div>
</div>
