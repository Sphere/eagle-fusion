<section #fullScreenContainer class="pdf-container">
  <mat-toolbar class="pdf-nav-bar flex justify-center" color="red" *ngIf="widgetData?.hideControls">
    <button mat-button [disabled]="currentPage.value < 2" (click)="loadPageNum(+currentPage.value - 1)"
      matTooltip="previous">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <mat-form-field class="auto-mat-form-field-input-infix" #input>
      <span matPrefix *ngIf="!isSmallViewPort">{{"Page" | translate}}</span>
      <input label="PageNumber" style="text-align: center;" aria-label="Page Number" class="pdf-page-num" type="number"
        min="1" [max]="totalPages" [formControl]="currentPage" matInput />
      <span matSuffix class="pl-2">of {{ totalPages }}</span>
    </mat-form-field>
    <button mat-button [disabled]="currentPage.value >= totalPages" (click)="loadPageNum(+currentPage.value + 1)"
      matTooltip="next">
      <mat-icon>chevron_right</mat-icon>
    </button>

    <div class="flex">
      <div class="pdf-fullscreen">
        <ws-widget-btn-fullscreen [widgetType]="'actionButton'" [widgetSubType]="'actionButtonFullscreen'"
          (fsState)="fullScreenState($event)" [widgetData]="{ fsContainer: fullScreenContainer }">
        </ws-widget-btn-fullscreen>
      </div>
    </div>
  </mat-toolbar>
  <ng-container *ngIf="widgetData?.pdfUrl && pdfViewerReady">
    <ngx-extended-pdf-viewer [src]="widgetData.pdfUrl" [height]="getPDFHeight" [zoom]="getPDFZoom"
      [page]="+currentPage.value" [showToolbar]="false" enablePinchOnMobile="true" (pageChange)="loadPageNum($event)"
      (pagesLoaded)="documentLoded($event)" [(sidebarVisible)]="sidebarOpen" [showHandToolButton]="false"
      [showSecondaryToolbarButton]="false" [showRotateButton]="false"></ngx-extended-pdf-viewer>
  </ng-container>
</section>
