<h1 mat-dialog-title i18n class="mb-2 heading">Logout Now</h1>
<div class="ws-mat-primary-text text-base pb-1 title-text" *ngIf="isDownloadable" i18n>
  Note: On logging out all the downloaded content will be deleted.
</div>
<div mat-dialog-content class="text-base hide-overflow pb-2" i18n>
  Are you sure?
</div>
<div mat-dialog-actions class="flex-row-reverse">
  <button mat-flat-button color="warn" [disabled]="disabled" (click)="confirmed()" i18n>
    Yes
  </button>
  <button mat-button class="margin-right-xs" [mat-dialog-close] i18n>No</button>
</div>
