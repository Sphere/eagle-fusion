<div class="dialog-shell">
  <h1 mat-dialog-title class="heading">{{ 'Logout Now' | translate }}</h1>

  <div mat-dialog-content class="content">
    {{ 'Are you sure?' | translate }}
  </div>

  <div class="download-note" *ngIf="isDownloadable">
    {{ 'Note: On logging out all the downloaded content will be deleted.' | translate }}
  </div>

  <div mat-dialog-actions class="actions">
    <button mat-button class="secondary-action" [mat-dialog-close]>
      {{ 'No' | translate }}
    </button>
    <button mat-flat-button color="warn" class="primary-action" [disabled]="disabled" (click)="confirmed()">
      {{ 'Yes' | translate }}
    </button>
  </div>
</div>
