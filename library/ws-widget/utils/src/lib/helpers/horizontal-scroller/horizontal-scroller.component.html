<section class="horizontal-scroll-container h-full">
  <div class="fade-left" [class.visible]="enablePrev"></div>
  <button aria-label="Previous" i18n-aria-label name="content-backward-button"
    (click)="showPrev()" class="scroll-btn prevBtn hidden-touch" [class.visible]="enablePrev">
    <mat-icon>chevron_left</mat-icon>
  </button>
  <div name="horizontal-scroll-content-strip" class="horizontal-scroll-content" #horizontalScrollElem>
    <ng-content></ng-content>
  </div>
  <div class="fade-right" [class.visible]="enableNext && loadStatus !== 'fetching'"></div>
  <button aria-label="Next" i18n-aria-label name="content-forward-button" (click)="showNext()"
    class="scroll-btn nextBtn hidden-touch" [class.visible]="enableNext && loadStatus !== 'fetching'">
    <mat-icon>chevron_right</mat-icon>
  </button>
  <div class="nextLoading" *ngIf="loadStatus === 'fetching'">
    <mat-spinner></mat-spinner>
  </div>
</section>
