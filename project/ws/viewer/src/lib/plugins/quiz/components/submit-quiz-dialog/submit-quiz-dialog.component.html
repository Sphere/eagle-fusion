<h2 mat-dialog-title>{{"Submit Quiz" | translate}}</h2>
<mat-dialog-content>
  <ng-container *ngIf="submissionState === 'answered'">
    {{"Do you want to submit?" | translate}}
  </ng-container>
  <ng-container *ngIf="submissionState === 'unanswered'">
    {{"You have not answered all the questions! Do you still want to submit?" | translate}}
  </ng-container>
  <ng-container *ngIf="submissionState === 'marked'">
    {{"You still have some questions marked for later! Do you still want to submit?" | translate}}
  </ng-container>
</mat-dialog-content>
<mat-dialog-actions class="flex-row-reverse">
  <button mat-button mat-dialog-close>{{"No" | translate}}</button>
  <button mat-button [mat-dialog-close]="true">{{"Yes" | translate}}</button>
</mat-dialog-actions>
