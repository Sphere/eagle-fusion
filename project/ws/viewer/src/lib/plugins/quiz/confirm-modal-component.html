<div class="overview-container">
    <div class="flex justify-end">
        <button mat-button class="close-icon" (click)="redirect()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div *ngIf="data.message" class="flex text-center">
        <p class="message-text">{{data.message | translate}}</p>
    </div>


    <h2 class="m-0 center-align title" mat-dialog-title>{{"Submit your feedback" | translate}}</h2>
    <mat-dialog-content>
        <form [formGroup]="ratingsForm">
            <div class="center-align">
                <div class="star-rating">
                    <button type="button" *ngFor="let star of stars; let i = index"
                        style="all: unset; display: contents; cursor: pointer;"
                        [attr.aria-label]="'Rate ' + (i + 1) + ' star' + (i > 0 ? 's' : '')"
                        (click)="setRating(i + 1)">
                        <img
                            [src]="star <= selectedRating ? '/fusion-assets/icons/star-filled.png' : '/fusion-assets/icons/star.png'"
                            alt="">
                    </button>
                </div>
            </div>
            <div class="rating-comment width-1-1 margin-top-m margin-bottom-l">
                <textarea (input)="setRating(selectedRating)" style="height: 96px;padding: 10px;" rows="4"
                    matInput [placeholder]="'Tell us more about what you felt' | translate" name=" name"
                    formControlName="review" required></textarea>
                <mat-error *ngIf="isSubmitPressed && !ratingsForm.controls.review.value">
                    {{"Comments is mandatory" | translate}}
                </mat-error>
            </div>
            <div class="margin-top-s margin-bottom-s center-align">
                <button class="margin-left-s submit-btn" (click)="submitData()" [disabled]="isMandatory"
                    [ngStyle]="{'opacity': isMandatory ? 0.7 : 1}" color="primary">
                    <ng-container>{{"Submit" | translate}}</ng-container>
                </button>
            </div>
        </form>
    </mat-dialog-content>
</div>
