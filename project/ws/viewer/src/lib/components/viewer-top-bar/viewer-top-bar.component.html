<mat-toolbar [color]="pageNavbar.color" [ngStyle]="pageNavbar?.styles" class="mat-primary mat-elevation-z3 mb-4 p-0">
  <ng-container *ngIf="!isSmall">
    <a [routerLink]="'/app'+'/toc/' + collectionId + '/chapters'" class="d-flex justify-content-end text-black ">
      <mat-icon class="">chevron_left</mat-icon>
    </a>

    <span *ngIf="logo" class="top-title text-left width-1-8 text-truncate">
      {{ collection?.name }}
    </span>
    <span class="header-spacer"></span>
    <div class="flex justify-center mt-0" style="position: absolute;right: 51px;top: 16px;">

      <ws-widget-btn-fullscreen [widgetType]="'actionButton'" [widgetSubType]="'actionButtonFullscreen'"
        [widgetData]="{ fsContainer: frameReference }" (fsState)="fullScreenState($event)"></ws-widget-btn-fullscreen>
    </div>
  </ng-container>
  <ng-container *ngIf="isSmall">
    <div class="">
      <div class="">
        <a [routerLink]="'/app'+'/toc/' + collectionId + '/chapters'" class=""
          style="    position: absolute;left: 5px;top: 30px;">
          <mat-icon class="">chevron_left</mat-icon>
        </a>
        <div class="" style="position: absolute;right: 51px;top: 16px;">
        </div>
      </div>

      <h3 *ngIf="logo" class=" pl-3" style="margin-left: 10px; font-size: 14px;">
        {{ (collection?.name.length > 20) ? (collection?.name | slice:0:29)+'...':(collection?.name)}}
      </h3>
    </div>

  </ng-container>
</mat-toolbar>
