<!-- Before the quiz data arrives the whole card used to be missing (blank player area). Gated on
     isFetchingDataComplete too: when the resolver returns no quiz, the parent never sets
     isErrorOccured, and the placeholder would otherwise shimmer forever. -->
<div class="padding-dynamic" *ngIf="!quizData && !isErrorOccured && !isFetchingDataComplete">
  <mat-card>
    <mat-card-content>
      <div class="video-player">
        <div class="quiz-skeleton" aria-hidden="true">
          <div class="ds-skeleton quiz-skeleton-title"></div>
          <div class="ds-skeleton quiz-skeleton-sub"></div>
          <div class="quiz-skeleton-stats">
            <div class="ds-skeleton quiz-skeleton-stat"></div>
            <div class="ds-skeleton quiz-skeleton-stat"></div>
            <div class="ds-skeleton quiz-skeleton-stat"></div>
          </div>
          <div class="ds-skeleton quiz-skeleton-button"></div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
<div class="padding-dynamic" *ngIf="quizData">
  <div class="flex flex-around flex-wrapped">
    <div class="w-full">
      <div>
        <mat-card>
          <mat-card-content>
            <div id="fullScreenContainer" class="video-player">
              <!-- Quiz-shaped placeholder while the quiz loads (was an empty box) -->
              <ng-container *ngIf="!isFetchingDataComplete">
              <div class="quiz-skeleton" aria-hidden="true">
                <div class="ds-skeleton quiz-skeleton-title"></div>
                <div class="ds-skeleton quiz-skeleton-sub"></div>
                <div class="quiz-skeleton-stats">
                  <div class="ds-skeleton quiz-skeleton-stat"></div>
                  <div class="ds-skeleton quiz-skeleton-stat"></div>
                  <div class="ds-skeleton quiz-skeleton-stat"></div>
                </div>
                <div class="ds-skeleton quiz-skeleton-button"></div>
              </div>
              </ng-container>
              <ng-container *ngIf="isFetchingDataComplete">
                <viewer-plugin-quiz [identifier]="quizData?.identifier" [artifactUrl]="quizData?.artifactUrl"
                  [name]="quizData?.name" [learningObjective]="quizData?.learningObjective"
                  [complexityLevel]="quizData?.complexityLevel" [duration]="quizJson?.timeLimit"
                  [progressStatus]="quizData?.progress?.progressStatus" [quizJson]="quizJson"
                  [collectionId]="collectionId" [viewStateChange]="stateChange">
                </viewer-plugin-quiz>
              </ng-container>
            </div>
            <div class="px-3">
              <app-player-navigation-widget></app-player-navigation-widget>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
    <div class="vidoe-title margin-top-m" *ngIf="quizData">
      <mat-card *ngIf="isSmall" class="unit-meta-item">
        <div class="flex">
        </div>
      </mat-card>
    </div>
  </div>
</div>
