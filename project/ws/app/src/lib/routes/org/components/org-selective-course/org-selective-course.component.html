<div id="page" class="site site-lp-page">
  <header id="masthead" class="site-header site-header--lp">
    <div class="site-header__wrap site-header__wrap--lp wrapper">
      <div class="site-branding">
        <img [src]="orgLogo" class="header-logo" alt="header" decoding="async" loading="lazy">
      </div>
    </div>
  </header>
  <div id="primary" class="content-area lp-page">
    <main id="main" class="site-main lp-page__components">
      <div class="banner wrapper component"
        [ngClass]="{ 'banner--logged-in': isLoggedIn, 'banner--logged-out': !isLoggedIn }">
        <img class="org-selective-banner" [src]="bannerImage" alt="banner" loading="lazy">

        <div class=" banner__content-wrap" *ngIf="bannerTitle || bannerPoints?.length > 0">
          <div class="banner__content-container">
            <h3 class="banner__title">{{ bannerTitle }}</h3>
            <div class="banner__content">
              <ul>
                <li *ngFor="let item of bannerPoints">{{ item }}</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <!-- .banner -->
      <div class="courses-block component">
        <div class="course-section wrapper" *ngIf="getContinueLearningCourses().length > 0">
          <div class="mb-4 flex scroller-container margin-top-20">
            <div class="w-100 line-label heading-line-yellow">
              <div class="flex flex-middle heading-line">
                <span class="course-header">{{'Continue Learning' | translate}}</span>
              </div>
            </div>
          </div>

          <div class="wrapper resource-container">
            <div *ngFor="let widget of getContinueLearningCourses(); let last = last"
              [ngClass]="{ 'last-child1': last }">
              <ws-mobile-course-view *ngIf="(isXSmall$ | async) === true" [displayConfig]="myCourseDisplayConfig"
                [courseData]="widget"></ws-mobile-course-view>
              <ws-web-course-card *ngIf="(isXSmall$ | async) === false" [displayConfig]="myCourseWebDisplayConfig"
                [courseData]="widget"></ws-web-course-card>
            </div>
          </div>
        </div>

        <div class="mb-4  flex scroller-container margin-top-20">
          <div class="w-100 line-label bg-green">
            <div class="flex flex-middle">
              <span class="course-header">{{'Elective Courses' | translate}}</span>
            </div>
          </div>
        </div>
        <div class="wrapper filter-section">
          <div *ngFor="let sem of semesterData">
            <span class="filter-btn" (click)="scrollToSem(sem.name)">{{ sem.name }}</span>
          </div>
        </div>
        <div *ngIf="isLoading" class="wrapper course-section loading">
          Loading courses...
        </div>

        <div class="course-section" *ngIf="!isLoading">
          <div *ngFor="let sem of semesterData">
            <div class="wrapper" [attr.id]="sanitizeId(sem.name)">
              <h2 class="semester-title margin-top-20">{{ sem.name }}</h2>
            </div>
            <div class="wrapper resource-container" *ngIf="sem.courses.length > 0; else noCourses">
              <div *ngFor="let widget of sem.courses; let last = last" [ngClass]="{ 'last-child1': last }">
                <ws-mobile-course-view *ngIf="(isXSmall$ | async) === true" [displayConfig]="myCourseDisplayConfig"
                  [courseData]="widget"></ws-mobile-course-view>
                <ws-web-course-card *ngIf="(isXSmall$ | async) === false" [displayConfig]="myCourseWebDisplayConfig"
                  [courseData]="widget"></ws-web-course-card>
              </div>
            </div>
            <ng-template #noCourses>
              <p class="no-results">No courses available for this semester.</p>
            </ng-template>
          </div>
        </div>
      </div> <!-- .courses-block -->

    </main><!-- #main -->

  <footer id="colophon" class="site-footer site-footer--lp">
    <div class="site-footer__wrap--lp wrapper">
      <img width="222" height="80" src="/fusion-assets/images/Sphere_Logo_4.svg" class="site-footer__lp-logo"

      <div class="site-footer__lp-content">
