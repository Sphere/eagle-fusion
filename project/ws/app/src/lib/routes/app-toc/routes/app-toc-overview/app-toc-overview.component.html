<!-- <ng-template wsAppAppTocOverview></ng-template> -->
<div class="flex flex-between flex-wrapped mt-4" *ngIf="loadOverview">
  <div class="meta-section">
    <!-- Content Body -->
    <div *ngIf="tocConfig?.overview?.body?.enabled && content?.instructions" class="unit-meta-item">
      <h2>{{'Description' | translate}}</h2>
      <mat-card-content>
        <div class="break-words" [innerHTML]="content?.instructions"></div>
      </mat-card-content>
    </div>

    <ng-template #creators let-authors="authors" let-title="title">
      <div class="unit-meta-item">
        <h2 *ngIf="title === 'AUTHOR'">{{'Authors' | translate}}</h2>
        <mat-divider></mat-divider>
        <div class="author">
          <ws-widget-user-image class="author-image" [imageType]="'name-initial'" [userName]="authors || ''">
          </ws-widget-user-image>
          <div class="width-expand flex flex-middle flex-between author-name">
            <h3 class="margin-remove">{{ authors }}</h3>
          </div>
        </div>
      </div>
    </ng-template>

    <ng-container *ngIf="currentLicenseData">
      <ws-app-license [currentLicenseData]="currentLicenseData"></ws-app-license>
    </ng-container>

  </div>
</div>
