<ws-widget-btn-page-back [widgetData]="{ url: 'home',titles:[{title:'Details',url:'none'}] }">
</ws-widget-btn-page-back>

<ws-app-app-toc-desktop role="banner" [banners]="banners" [forPreview]="forPreview" [content]="content"
  [resumeData]="resumeData" [batchData]="batchData"></ws-app-app-toc-desktop>

<ng-container>
  <div role="main" class="toc-body" *ngIf="!errorCode; else tocError">
    <nav mat-tab-nav-bar id="mat-nav" class="toc-links mt-8 mat-app-background">
      <a mat-tab-link [routerLink]="'./overview'" (click)="toggleComponent('overview')" id="overview-link"
        [ngClass]="{'ws-mat-primary-text link-active':  routelinK === 'overview'}" wsAppRetainScroll>{{"Overview" |
        translate}}</a>
      <a mat-tab-link *ngIf="content?.resourceType === 'Certification'" [routerLink]="'./certification'"
        routerLinkActive="ws-mat-primary-text link-active">
        <ng-container *ngIf="content?.isExternal === true">{{'Certification' | translate}}</ng-container>
        <ng-container *ngIf="content?.isExternal === false">{{'Take Certification' | translate}}</ng-container>
      </a>

      <a *ngIf="content?.children?.length" mat-tab-link (click)="toggleComponent('contents')"
        [routerLink]="'./contents'" [queryParams]="{batchId: batchId ,contentId: content.identifier}"
        [ngClass]="{'ws-mat-primary-text link-active': routelinK === 'contents'}" id="content-link"
        wsAppRetainScroll>{{"Contents" | translate}}</a>

      <a mat-tab-link (click)="toggleComponent('license')" [routerLink]="'./license'" [queryParams]="{license: license}"
        [ngClass]="{'ws-mat-primary-text link-active': routelinK === 'license'}" wsAppRetainScroll>{{'License' |
        translate}}</a>
      <a mat-tab-link (click)="redirectTo()" (keydown.enter)="redirectTo()"
        (keydown.space)="redirectTo(); $event.preventDefault()" tabindex="0"
        [ngClass]="{'ws-mat-primary-text link-active': routelinK === 'discuss'}"
        id="license-link" wsAppRetainScroll>{{'Discuss' | translate}}</a>

    </nav>

    <all-discussion-widget *ngIf="loadDiscussionWidget" style=' width: 100%;' [config]="discussionConfig">
    </all-discussion-widget>

    <router-outlet></router-outlet>
    <ng-container>

    </ng-container>
  </div>
</ng-container>

<ng-template #tocError>
  <div [wsResolverWidget]="errorWidgetData"></div>
</ng-template>
