<!-- Shimmer while loading -->
<div *ngIf="isLoading" class="shimmer-container">
  <div class="shimmer-header-row">
    <div class="shimmer shimmer-title"></div>
    <div class="shimmer shimmer-btn"></div>
    <div class="shimmer shimmer-close"></div>
  </div>
  <div class="shimmer shimmer-image"></div>
</div>

<!-- Certificate modal -->
<div *ngIf="!isLoading" class="cert-modal">
  <div class="cert-header">
    <div class="cert-title-wrap">
      <mat-icon class="cert-icon">workspace_premium</mat-icon>
      <div class="cert-title-text">
        <span class="cert-label">{{ 'Certificate preview of course:' | translate }}</span>
        <span class="cert-name" [title]="content.tocConfig">{{ content.tocConfig }}</span>
      </div>
    </div>
    <div class="cert-actions">
      <button class="download-btn" (click)="downloadCertificate(content)">
        <mat-icon>file_download</mat-icon>
        <span class="btn-label">{{ 'Download' | translate }}</span>
      </button>
      <button class="close-btn" [mat-dialog-close]="true" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="cert-image-wrap">
    <img [src]="img" class="cert-image" alt="Certificate" />
  </div>

  <canvas id="certCanvas" class="cert-canvas"></canvas>
</div>
