<div class="content" [ngStyle]="showbackButton ? {'padding': '0' } : {}">
  <ws-mobile-profile-nav [trigerrNavigation]=" trigerrNavigation" [showbackButton]="showbackButton"
    [showLogOutIcon]="showLogOutIcon">
  </ws-mobile-profile-nav>
  <p class="text-2xl mt-2">{{ data?.title | translate }}</p>
  <ng-container *ngIf="isEkshamata">
    <div class="form-group input-box"
      *ngIf="ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.designation">
      <label>{{ 'Position' | translate }}</label>
      <input type="text" class="form-control"
        [value]="ekshamataData.profileDetails.profileReq.professionalDetails[0].designation" readonly disabled />
    </div>

    <div class="form-group input-box" *ngIf="ekshamataData?.channel">
      <label>{{ 'Department Name' | translate }}</label>
      <input type="text" class="form-control" [value]="ekshamataData.channel" readonly disabled />
    </div>

    <div class="form-group input-box"
      *ngIf="ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.facilityName">
      <label>{{ 'Facility Name' | translate }}</label>
      <input type="text" class="form-control"
        [value]="ekshamataData.profileDetails.profileReq.professionalDetails[0].facilityName" readonly disabled />
    </div>

    <div class="form-group input-box" *ngIf="
      ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.facilityCode ||
      ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.nin ||
      ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.hrmsId
    ">
      <label>{{ 'Facility Code' | translate }}</label>
      <input type="text" class="form-control" [value]="
        ekshamataData.profileDetails.profileReq.professionalDetails[0].facilityCode ||
        ekshamataData.profileDetails.profileReq.professionalDetails[0].nin ||
        ekshamataData.profileDetails.profileReq.professionalDetails[0].hrmsId
      " readonly disabled />
    </div>

    <div class="form-group input-box"
      *ngIf="ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.facilityType">
      <label>{{ 'Facility Type' | translate }}</label>
      <input type="text" class="form-control"
        [value]="ekshamataData.profileDetails.profileReq.professionalDetails[0].facilityType" readonly disabled />
    </div>
  </ng-container>

  <form *ngIf="!isEkshamata" [formGroup]="personalDetailForm" class="mt-3 mb-5">
    <ng-container *ngFor="let field of data?.formData">
      <div *ngIf="field.type === 'mat-select'">
        <label [for]="field.key" style="display: block;">{{ field.label | translate }}</label>
        <mat-form-field appearance="outline" class="field-fullwidth" style="width: 100%;">
          <mat-select [formControlName]="field.key" [placeholder]="field.placeholder | translate"
            (selectionChange)="professionalChange($event.value)">
            <mat-option [value]="profession" *ngFor="let profession of getOptions(field)">{{profession}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <ng-container *ngIf="shouldShowField(field)">
        <div class="form-group input-box" *ngIf="field.type === 'select'">
          <label [for]="field.key" *ngIf="field.label" style="display: block;">{{ field.label | translate }}</label>
          <select [id]="field?.key" class="form-control select-box" [formControlName]="field.key"
            [required]="field.required" (change)="handleChange($event.target, field)">
            <option [value]="null" [disabled]="field.disabled">{{ field.placeholder | translate }}</option>
            <option *ngFor="let opt of getOptions(field)" [value]="opt">{{ opt }}</option>
          </select>
        </div>
        <div class="form-group input-box" *ngIf="field.type === 'text'">
          <label *ngIf="field.label" [for]="field.key">{{ field?.label | translate }}</label>
          <input class="form-control" [formControlName]="field.key" [required]="field.required"
            [placeholder]="field.placeholder | translate" autocomplete="off" />
        </div>
      </ng-container>
      <div *ngIf="field.type === 'submit'">
        <button class="save-btn" [type]="field.type" [disabled]="personalDetailForm.invalid"
          (click)="onSubmit(personalDetailForm)">{{ field.label | translate }}
        </button>
      </div>
    </ng-container>
  </form>
  <input type="hidden" [value]="data.sucessMsg" #toastSuccess />
</div>
