<!-- The card no longer hides itself when the preview is missing. A certificate whose
     thumbnail failed to load is still a certificate the learner earned: show its name
     and keep the download available, since the download can succeed even when the
     preview did not. -->
<div class="column py-2 px-0  position-relative " *ngIf="certificateData">
  <div class="flex">
    <div class="">
      <img *ngIf="certificateData.image" alt="Certificate" [src]="certificateData.image"
        width="100px" height="auto" loading="lazy" />
      <div *ngIf="!certificateData.image" class="cert-thumb-fallback" aria-hidden="true"></div>
    </div>
    <div class="mx-0">
      <p class="text-base mb-0 name">{{certificateData.name}}</p>
    </div>
    <div>
      <a (click)="convertToJpeg(certificateData)" (keydown.enter)="convertToJpeg(certificateData)"
        (keydown.space)="convertToJpeg(certificateData); $event.preventDefault()" tabindex="0" class="certificate-img-box"
        style="position: absolute; left: 450px; top: 20px;">
        <img alt="download certificate" src="/fusion-assets/images/download_cer.svg" width="18" height="18" />
      </a>

    </div>
  </div>
</div>
<canvas id="certCanvas"></canvas>
