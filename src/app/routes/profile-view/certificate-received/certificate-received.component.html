<!-- The card no longer hides itself when the preview is missing. A certificate whose
     thumbnail failed to load is still a certificate the learner earned: show its name
     and keep the download available, since the download can succeed even when the
     preview did not. -->
<!-- One row: preview, name (wraps), download at the right edge. The download link used to be
     absolutely positioned at left: 450px, which put it off-screen on phones (and made the page
     scroll sideways), and the name had a fixed 330px width. -->
<div class="cert-row" *ngIf="certificateData">
  <div class="cert-thumb">
    <img *ngIf="certificateData.image" alt="Certificate" [src]="certificateData.image" width="100" height="65"
      loading="lazy" />
    <div *ngIf="!certificateData.image" class="cert-thumb-fallback" aria-hidden="true">
      <img src="./fusion-assets/icons/certificate-icon.svg" alt="" width="28" height="28" />
    </div>
  </div>
  <p class="text-base mb-0 name">{{certificateData.name}}</p>
  <a (click)="convertToJpeg(certificateData)" (keydown.enter)="convertToJpeg(certificateData)"
    (keydown.space)="convertToJpeg(certificateData); $event.preventDefault()" tabindex="0" role="button"
    class="certificate-img-box" [attr.aria-label]="'Download' | translate">
    <img alt="" src="/fusion-assets/images/download_cer.svg" width="18" height="18" />
  </a>
</div>
<canvas id="certCanvas"></canvas>
