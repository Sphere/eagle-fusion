<div class="content" [ngStyle]="showbackButton ? {'padding': '0' } : {}">

  <ws-mobile-profile-nav [trigerrNavigation]=" trigerrNavigation" [showbackButton]="showbackButton"
    [showLogOutIcon]="showLogOutIcon"></ws-mobile-profile-nav>

  <p class="text-2xl mt-2 mb-2">{{ data?.title | translate }}</p>
  <ng-container *ngIf="isEkshamata">
    <div class="form-group input-box"
      *ngIf="ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.instituteName">
      <label for="institutionNameField">{{ 'Institution Name' | translate }}</label>
      <input id="institutionNameField" type="text" class="form-control"
        [value]="ekshamataData?.profileDetails?.profileReq?.professionalDetails[0]?.instituteName" readonly disabled />
    </div>
  </ng-container>
  <div class="inline-block" *ngIf="!isEkshamata">
    <div *ngFor="let academic of academicsArray">
      <div *ngIf="!isEkshamata && isEditableForSphere" class="edit-icon">
        <mat-icon *ngIf="academicsArray.length>0 && academic.nameOfInstitute"
          [class]="'float-right cursor-pointer' + data?.button?.icon" tabindex="0"
          (click)="redirectTo(true,academic)" (keydown.enter)="redirectTo(true,academic)"
          (keydown.space)="redirectTo(true,academic); $event.preventDefault()">{{data?.button?.label | translate}}</mat-icon>
      </div>

      <div class="inline-block mt-1" *ngIf="academic.nameOfInstitute">
        <p class="heading pt-2 pb-1" *ngIf="academic.type">{{academic.type}}</p>
        <p class="head-2 py-1" *ngIf="academic.nameOfQualification">{{academic.nameOfQualification}}</p>
        <p class="head-2 py-1" *ngIf="academic.nameOfInstitute">{{academic.nameOfInstitute}}</p>
        <p class="head-3 py-1" *ngIf="academic.yearOfPassing">{{academic.yearOfPassing}}</p>
      </div>
    </div>
  </div>

  <mat-divider class="mt-2"></mat-divider>
  <div *ngIf="!isEkshamata && isEditableForSphere && data?.show" class="mt-3">
    <button type="button" class="add-edu-txt inline-block cursor-pointer"
      style="background: none; border: none; padding: 0; margin: 0; font: inherit; color: inherit; text-align: inherit;"
      (click)="redirectTo(false)">{{ data?.sub_header | translate }}
    </button>
  </div>

  <p *ngIf="!isEkshamata && !isEditableForSphere && !hasValidAcademics"
    style="color: var(--theme-inactive, #808080); font-size: 14px; margin-top: 12px;">
    {{ 'No education details available' | translate }}
  </p>

</div>
