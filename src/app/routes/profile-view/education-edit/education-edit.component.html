<div class="content" [ngStyle]="showbackButton ? {'padding': '0' } : {}">
  <ws-mobile-profile-nav [showbackButton]="showbackButton" [showLogOutIcon]="showLogOutIcon"></ws-mobile-profile-nav>
  <p class="text-2xl mt-2">{{ 'Education' | translate }}</p>

  <form [formGroup]="educationForm" class="mt-3">
    <div>
      <div class="form-group input-box">
        <label for="courseDegree">{{ 'Grade/Degree' | translate }}</label>
        <select id="courseDegree" formControlName="courseDegree" class="form-control select-box"
          [attr.aria-label]="'Grade/Degree' | translate">
          <option [ngValue]="''" disabled>{{ 'Grade/Degree' | translate }}</option>
          <option *ngFor="let academic of academics" [ngValue]="academic">{{ academic.type }}</option>
        </select>
      </div>

      <div class="form-group input-box"
        *ngIf="educationForm.controls['courseDegree'].value && educationForm.controls['courseDegree'].value.type === 'GRADUATE' ||  educationForm.controls['courseDegree'].value && educationForm.controls['courseDegree'].value.type === 'POSTGRADUATE'">
        <label for="courseName">{{ 'Course Name' | translate }}</label>
        <input id="courseName" type="text" [placeholder]="'Course Name' | translate"
          [attr.aria-label]="'Course Name' | translate" formControlName="courseName" class="form-control"
          autocomplete="off">
      </div>

      <div class="form-group input-box">
        <label for="institutionName">{{ 'Institution Name' | translate }}</label>
        <input id="institutionName" type="text" formControlName="institutionName" class="form-control"
          [placeholder]="'Institution Name' | translate" [attr.aria-label]="'Institution Name' | translate"
          autocomplete="off">
      </div>

      <div class="form-group input-box">
        <label for="yearPassing">{{ 'Year of Passing' | translate }}</label>
        <input id="yearPassing" type="text" formControlName="yearPassing" [placeholder]="'Year of Passing' | translate"
          [attr.aria-label]="'Year of Passing' | translate" class="form-control" autocomplete="off">
        <mat-error class="text-danger" *ngIf="educationForm.controls.yearPassing.errors?.pattern">
          {{ 'Please enter a valid 4 digit year' | translate }}
        </mat-error>
      </div>
    </div>

    <button
      *ngIf="isEditableForSphere&&educationForm.controls['courseDegree'].value && educationForm.controls['courseDegree'].value.type === 'GRADUATE' ||  educationForm.controls['courseDegree'].value && educationForm.controls['courseDegree'].value.type === 'POSTGRADUATE'; else normal "
      type="submit" (click)="onSubmit(educationForm)" class="save-btn" [disabled]="educationForm?.invalid">
      {{ 'Save' | translate }}
    </button>
    <ng-template #normal>
      <button *ngIf="isEditableForSphere" type="submit" (click)="onSubmit(educationForm)" class="save-btn"
        [disabled]="educationForm?.invalid">
        {{ 'Save' | translate }}
      </button>
    </ng-template>
  </form>
  <input type="hidden" i18-value i18-aria-value aria-value="User profile details update successful"
    value="User profile details updated successfully!" #toastSuccess />
</div>
