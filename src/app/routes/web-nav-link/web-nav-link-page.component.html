<div class="link-container" *ngIf="!mode && (data?.tncAccepted || data?.dob)">
  <button *ngIf="orgData?.themeConfig?.isDark" mat-button (click)="toggleTheme()" matTooltip="Toggle theme">
    <mat-icon>brightness_6</mat-icon>
  </button>
  <div class="link-block" *ngFor="let item of menuItems">
    <a role="button" *ngIf="item.type==='text'" matRipple [ngClass]="{'ws-mat-accent-text': item.show }"
      (click)="redirect(item)" class="flex cursor-pointer">
      <span class="link-text">{{item.title | translate}}</span>
    </a>
    <button *ngIf="item.type==='button-icon'" (keydown)="handleKeyDown($event)" (click)="redirect(item)" matRipple
      routerLinkActive="ws-mat-accent-text" class="flex cursor-pointer bg-transparent border-0">
      <img [alt]="item.redirect" width="20" height="24" [src]="item?.image?.src">
      <span *ngIf="numberOfNotification" class="badge">{{numberOfNotification}}</span>
    </button>
  </div>
</div>
<!-- Mobile bottom tabs -->
<div>
  <nav class="mobile-bottom-nav" *ngIf="mode && menuItems?.length">
    <button class="nav-item" *ngFor="let tab of menuItems" [class.active]="tab?.active" (click)="redirect(tab)">
      <img [src]="tab?.image?.src" class="nav-icon feature-icon-img" [alt]="tab?.title" />
      <span class="nav-label">{{ tab?.title | translate}}</span>
    </button>
  </nav>
</div>
