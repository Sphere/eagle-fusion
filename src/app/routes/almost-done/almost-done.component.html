<div class="login-page-content">
  <div class="login-card">
    <h1>{{ 'Almost done!' | translate }}</h1>
    <p><span style="float:left;"><span>{{ 'Background' | translate }}</span>: {{backgroundSelect}}</span>
      <span style="float:right;color: var(--theme-accent); cursor: pointer;" tabindex="0" role="button"
        (click)='redirectToYourBackground()' (keydown.enter)='redirectToYourBackground()'
        (keydown.space)='redirectToYourBackground(); $event.preventDefault()'>{{
        'Change' |
        translate }}</span>
    </p>
    <div class="input-content">
      <div class="input-content-wrapper">
        <form [formGroup]="almostDoneForm" class="mt-5">

          <!-- Background: Healthcare Worker -->
          <div *ngIf="backgroundSelect ==='Healthcare Worker'">
            <div class="form-group input-box">
              <select id="profession-healthcare-worker" aria-label="Designation" formControlName="professSelected" class="form-control select-box"
                (change)="professionSelect($event.target.value); assignFields('profession', $event.target.value, $event)"
                required>
                <option [value]="null" style="color: var(--theme-inactive, #808080);" disabled>{{ 'Designation*' |
                  translate }}</option>
                <option *ngFor="let profession of healthWorkerProfessions" [value]="profession">{{ profession }}
                </option>
              </select>
            </div>

            <div class="form-group input-box" *ngIf="professionOthersField">
              <input aria-label="Please Specify" type="text" formControlName="professionOtherSpecify" [placeholder]="'Please Specify*' | translate"
                class="form-control" autocomplete="off">
            </div>
            <mat-error class="text-danger mb-4"
              *ngIf="almostDoneForm.controls['professionOtherSpecify'].hasError('pattern')">
              {{errorMsg}}</mat-error>

            <div class="form-group rnBox">
              <input aria-label="RN/RM Number" type="text" formControlName="rnNumber" class="form-control rnField"
                [placeholder]="'RN/RM Number' | translate" autocomplete="off" [readonly]="rnFieldDisabled" autofocus>
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['rnNumber'].hasError('pattern')">
              {{errorMsg}}</mat-error>

            <div class="form-group input-box">
              <select id="orgType-healthcare-worker" aria-label="Organization Type" formControlName="orgType" class="form-control select-box"
                (change)="orgTypeSelect($event.target.value); assignFields('organizationType',$event.target.value, $event)"
                required>
                <option [value]="null" disabled>{{ 'Organization Type*' | translate }}</option>
                <option *ngFor="let orgType of orgTypes" [value]="orgType">{{ orgType }}</option>
              </select>
            </div>

            <div class="form-group input-box" *ngIf="orgOthersField">
              <input aria-label="Please Specify" type="text" formControlName="orgOtherSpecify" class="form-control "
                [placeholder]="'Please Specify*' | translate" autocomplete="off">
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['orgOtherSpecify'].hasError('pattern')">
              {{errorMsg}}</mat-error>

            <div class="form-group input-box">
              <input aria-label="Organization Name" type="text" name="orgName" formControlName="orgName"
                [placeholder]="'Organization Name' | translate" class="form-control" autocomplete="off"
                (change)="assignFields('organizationName',almostDoneForm.controls['orgName'].value, $event)">
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['orgName'].hasError('pattern')">
              {{errorMsg}}</mat-error>
          </div>
          <!-- Background: Healthcare Worker -->

          <div *ngIf="backgroundSelect === 'ASHA'">
            <div class="form-group input-box">
              <select id="profession-asha" aria-label="Designation" formControlName="professSelected" class="form-control select-box" required
                (change)="professionSelect($event.target.value); assignFields('profession', $event.target.value, $event)">
                <option [value]="null" disabled>{{'Designation*' | translate }}</option>
                <option *ngFor="let profession of ashaList" [value]="profession">{{ profession }}
                </option>
              </select>
            </div>
            <div class="form-group input-box">
              <select id="locationselect-asha" aria-label="City/District" formControlName="locationselect" class="form-control select-box" required
                (change)="assignFields('locationselect', $event.target.value, $event)">
                <option [value]=null disabled>{{ 'City/Distict' | translate }}</option>
                <option *ngFor="let distict of disticts" [value]="distict">{{ distict }}</option>
              </select>
            </div>
            <div class="form-group input-box">
              <input aria-label="Block" type="text" name="block" formControlName="block" class="form-control"
                [placeholder]="'Block' | translate" autocomplete="off"
                (change)="assignFields('block',almostDoneForm.controls['block'].value, $event)">
            </div>
            <div class="form-group input-box">
              <input aria-label="Sub Centre" type="text" name="subcentre" formControlName="subcentre" class="form-control"
                [placeholder]="'Sub Centre' | translate" autocomplete="off"
                (change)="assignFields('subcentre',almostDoneForm.controls['subcentre'].value, $event)">
            </div>
          </div>
          <!-- Background: Healthcare Volunteer -->
          <div *ngIf="backgroundSelect ==='Healthcare Volunteer'">
            <div class="form-group input-box">
              <select id="profession-healthcare-volunteer" aria-label="Designation" formControlName="professSelected" class="form-control select-box" required
                (change)="professionSelect($event.target.value); assignFields('profession', $event.target.value, $event)">
                <option [value]="null" disabled>{{ 'Designation*' | translate }}</option>
                <option *ngFor="let profession of healthVolunteerProfessions" [value]="profession">{{ profession }}
                </option>
              </select>
            </div>

            <div class="form-group input-box" *ngIf="professionOthersField">
              <input aria-label="Please Specify" type="text" formControlName="professionOtherSpecify" [placeholder]="'Please Specify*' | translate"
                class="form-control" autocomplete="off">
            </div>
            <mat-error class="text-danger mb-4"
              *ngIf="almostDoneForm.controls['professionOtherSpecify'].hasError('pattern')">
              {{errorMsg}}</mat-error>

            <div class="form-group input-box">
              <select id="orgType-healthcare-volunteer" aria-label="Organization Type" formControlName="orgType" class="form-control select-box" required
                (change)="orgTypeSelect($event.target.value); assignFields('organizationType',$event.target.value, $event)">
                <option [value]="null" disabled>{{ 'Organization Type*' | translate }}</option>
                <option *ngFor="let orgType of orgTypes" [value]="orgType">{{ orgType }}</option>
              </select>
            </div>

            <div class="form-group input-box" *ngIf="orgOthersField">
              <input aria-label="Please Specify" type="text" formControlName="orgOtherSpecify" class="form-control "
                [placeholder]="'Please Specify*' | translate" autocomplete="off">
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['orgOtherSpecify'].hasError('pattern')">
              {{errorMsg}}</mat-error>

            <div class="form-group input-box">
              <input aria-label="Organization Name" type="text" name="orgName" formControlName="orgName" class="form-control"
                [placeholder]="'Organization Name' | translate" autocomplete="off"
                (change)="assignFields('organizationName',almostDoneForm.controls['orgName'].value, $event)">
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['orgName'].hasError('pattern')">
              {{errorMsg}}</mat-error>
          </div>
          <!-- Background: Healthcare Volunteer -->

          <!-- Background: Student -->
          <div *ngIf="backgroundSelect ==='Student'">
            <div class="form-group input-box">
              <select id="profession-student" aria-label="Designation" formControlName="professSelected" class="form-control select-box" required
                (change)="professionSelect($event.target.value); assignFields('profession', $event.target.value, $event)">
                <option [value]="null" disabled>{{ 'Designation*' | translate }}</option>
                <option *ngFor="let profession of studentList" [value]="profession">{{ profession }}
                </option>
              </select>
            </div>
            <div class="form-group mt-4 input-box">
              <input aria-label="Qualification" type="text" class="form-control" formControlName="courseName"
                [placeholder]="'Qualification' | translate"
                (change)="assignFields('coursename',almostDoneForm.controls['courseName'].value, $event)">
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['courseName'].hasError('pattern')">
              {{errorMsg}}</mat-error>
            <div class="form-group mt-4 input-box">
              <input aria-label="Institution Name" type="text" class="form-control" formControlName="instituteName"
                [placeholder]="'Institution Name' | translate"
                (change)="assignFields('institutionName',almostDoneForm.controls['instituteName'].value, $event)"
                required>
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['instituteName'].hasError('pattern')">
              {{errorMsg}}</mat-error>
          </div>
          <!-- Background: Student -->

          <!-- Background: Faculty -->
          <div *ngIf="backgroundSelect ==='Faculty'">
            <div class="form-group input-box">
              <select id="profession-faculty" aria-label="Designation" formControlName="professSelected" class="form-control select-box" required
                (change)="professionSelect($event.target.value); assignFields('profession', $event.target.value, $event)">
                <option [value]="null" disabled>{{ 'Designation*' | translate }}</option>
                <option *ngFor="let profession of facultyList" [value]="profession">{{ profession }}
                </option>
              </select>
            </div>

            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['profession'].hasError('pattern')">
              {{errorMsg}}</mat-error>

            <div class="form-group mt-4 input-box">
              <input aria-label="Institution Name" type="text" class="form-control" formControlName="orgName"
                [placeholder]="'Institution Name*' | translate" required>
            </div>
            <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['orgName'].hasError('pattern')">
              {{errorMsg}}</mat-error>

          </div>
          <!-- Background: Faculty -->

          <!-- Background: Others -->
          <div *ngIf="backgroundSelect ==='Others'">
            <div class="form-group input-box">
              <select id="selectBackground" aria-label="Select Background" formControlName="selectBackground" class="form-control select-box"
                (change)="chooseBackground($event.target.value)" required>
                <option [value]="null" disabled>{{ 'Select Background' | translate }}</option>
                <option value="Mother/Family Members">Mother/Family Members</option>
                <option value="Asha Facilitator" *ngIf='!hideAsha'>Asha Facilitator</option>
                <option value="Asha Trainer" *ngIf='!hideAsha'>Asha Trainer</option>
                <option value="Other">Others</option>
              </select>
            </div>
            <div *ngIf="selectedBg === 'Asha Facilitator' ||  selectedBg === 'Asha Trainer'">
              <div class="form-group input-box">
                <select id="locationselect-others" aria-label="City/District" formControlName="locationselect" class="form-control select-box" required
                  (change)="assignFields('locationselect', $event.target.value, $event)">
                  <option [value]=null disabled>{{ 'City/Distict' | translate }}</option>
                  <option *ngFor="let distict of disticts" [value]="distict">{{ distict }}</option>
                </select>
              </div>
              <div class="form-group input-box">
                <input aria-label="Block" type="text" name="block" formControlName="block" class="form-control"
                  [placeholder]="'Block' | translate" autocomplete="off"
                  (change)="assignFields('block',almostDoneForm.controls['block'].value, $event)">
              </div>
              <div class="form-group input-box">
                <input aria-label="Sub Centre" type="text" name="subcentre" formControlName="subcentre" class="form-control"
                  [placeholder]="'Sub Centre' | translate" autocomplete="off"
                  (change)="assignFields('subcentre',almostDoneForm.controls['subcentre'].value, $event)">
              </div>
            </div>
            <div *ngIf="selectedBg === 'Other'">
              <div class="form-group mt-4 input-box">
                <input aria-label="Please Specify Profession" type="text" class="form-control" formControlName="profession"
                  [placeholder]="'Please Specify Profession*' | translate" required>
              </div>
              <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['profession'].hasError('pattern')">
                {{errorMsg}}</mat-error>

              <div class="form-group input-box">
                <select id="orgType-others" aria-label="Organization Type" formControlName="orgType" class="form-control select-box"
                  (change)="orgTypeSelect($event.target.value)" required>
                  <option [value]="null" disabled>{{ 'Organization Type*' | translate }}</option>
                  <option *ngFor="let orgType of orgTypes" [value]="orgType">{{ orgType }}</option>
                </select>
              </div>

              <div class="form-group input-box" *ngIf="orgOthersField">
                <input aria-label="Please Specify" type="text" formControlName="orgOtherSpecify" class="form-control"
                  [placeholder]="'Please Specify*' | translate" autocomplete="off">
              </div>
              <mat-error class="text-danger mb-4"
                *ngIf="almostDoneForm.controls['orgOtherSpecify'].hasError('pattern')">
                {{errorMsg}}</mat-error>

              <div class="form-group input-box">
                <input aria-label="Organization Name" type="text" name="orgName" formControlName="orgName" class="form-control"
                  [placeholder]="'Organization Name' | translate" autocomplete="off">
              </div>
              <mat-error class="text-danger mb-4" *ngIf="almostDoneForm.controls['orgName'].hasError('pattern')">
                {{errorMsg}}</mat-error>
            </div>
          </div>
          <!-- Background: Others -->

          <div class="next-btn-div">
            <button class="form-group login-button" type="submit" (click)='onsubmit()' id="done-btn"
              [disabled]="!almostDoneForm?.valid || enableSubmit">{{ 'Done' | translate }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
