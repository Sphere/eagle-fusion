<!-- ================= Page Banner ================= -->
<div class="banner-container" [ngClass]="{ 'isEkshamata': isEkshamata, 'isXsmall': isXsmall }">
  <div class="carousel">
    <!-- ================= Banner Text ================= -->
    <div class="banner-heading-container">
      <div class="heading">
        <div class="banner-mini-heading">{{ uiConfig?.title | translate }}</div>
        <div class="banner-heading"><span>{{ firstName() || '' | translate }}</span></div>
      </div>
      <div *ngIf="shouldShowBadges" class="badge-container">
        <img src="fusion-assets/icons/trophy.png" alt="Trophy" />
        <span class="label">{{noOfBadges > 1 ? ('BADGES_EARNED' | translate : {count: noOfBadges}) :
          ('BADGE_EARNED' | translate)}}</span>
      </div>
      <div class="banner-sub-heading">{{ uiConfig?.subTitle | translate }}</div>
    </div>
    <!-- ================= Ekshamata Banner ================= -->
    <div *ngIf="isEkshamata" class="ekshamta-banner-container">
      <div class="ekshamata-banner">
        <img class="banner-first-image" [src]="bannerFirstImage" alt="Banner 1" loading="lazy" />
        <img class="banner-second-image" [src]="bannerSecondImage" alt="Banner 2" loading="lazy" />
      </div>
    </div>
    <!-- ================= Sphere Banner (Web + Mobile) ================= -->
    <div *ngIf="!isEkshamata" class="slides-viewport">
      <div class="slides" [style.transform]="'translateX(' + (-currentSlideIndex * 100) + '%)'">
        <div class="slide" *ngFor="let data of dataCarousel; let i = index">
          <div class="slide-content" tabindex="0" role="button" (click)="scrollToHowSphereWorks(data?.scrollEmit)"
            (keydown.enter)="scrollToHowSphereWorks(data?.scrollEmit)"
            (keydown.space)="scrollToHowSphereWorks(data?.scrollEmit); $event.preventDefault()">
            <div class="banner-shimmer" *ngIf="!imgsLoaded[i]"></div>
            <img class="banner-image" [src]="!isDark ? data?.img: data?.darkimg" alt="Carousel" loading="lazy"
              (load)="onBannerImgLoad(i)" (error)="onBannerImgLoad(i)" />
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ================= Carousel Dots (Sphere Only) ================= -->
<div *ngIf="!isEkshamata" class="carousel-dots">
  <button *ngFor="let _ of dataCarousel; let i = index" class="dot-btn" [class.active]="i === currentSlideIndex"
    (click)="goToSlide(i)" [attr.aria-label]="'Go to slide ' + (i + 1)">
  </button>
</div>
