<!-- ================= Page Banner ================= -->
<div class="banner-container" [ngClass]="{ 'isEkshamata': isEkshamata }">
  <div class="carousel">
    <!-- ================= Banner Text ================= -->
    <div class="banner-heading-container">
      <div class="heading">
        <div class="banner-mini-heading">{{ uiConfig?.title | translate }}</div>
        <div class="banner-heading"><span>{{ firstName() || '' | translate }}</span></div>
      </div>
      <div *ngIf="shouldShowBadges" class="badge-container">
        <img src="fusion-assets/icons/trophy.png" />
        <span class="label">{{noOfBadges > 1 ? ('BADGES_EARNED' | translate : {count: noOfBadges}) :
          ('BADGE_EARNED' | translate)}}</span>
      </div>
      <div class="banner-sub-heading">{{ uiConfig?.subTitle | translate }}</div>
    </div>
    <!-- ================= Ekshamata Banner ================= -->
    <div *ngIf="isEkshamata" class="ekshamta-banner-container">
      <div class="ekshamata-banner">
        <img class="banner-first-image" [src]="bannerFirstImage" alt="Banner image 1" loading="lazy" />
        <img class="banner-second-image" [src]="bannerSecondImage" alt="Banner image 2" loading="lazy" />
      </div>
    </div>
    <!-- ================= Sphere Banner (Web + Mobile) ================= -->
    <div *ngIf="!isEkshamata" class="slides" [style.transform]="'translateX(' + (-currentSlideIndex * 100) + '%)'">
      <div class="slide" *ngFor="let data of dataCarousel; let i = index">
        <div class="slide-content" [class.active]="i === currentSlideIndex"
          (click)="scrollToHowSphereWorks(data?.scrollEmit)">

          <img class="banner-image" [src]="data?.img" alt="Carousel image" loading="lazy" />
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ================= Carousel Dots (Sphere Only) ================= -->
<div *ngIf="!isEkshamata" class="carousel-dots">
  <button *ngFor="let _ of dataCarousel; let i = index" class="round-buttons" [class.active]="i === currentSlideIndex"
    (click)="goToSlide(i)">
    <img class="dot-icon" [src]="i === currentSlideIndex
        ? '/fusion-assets/icons/active_dot.svg'
        : '/fusion-assets/icons/gray_dot.svg'" alt="carousel dot" />
  </button>
</div>
