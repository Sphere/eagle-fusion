<!-- video-popup.component.html -->
<div class="video-dialog-wrapper">
  <button class="close-btn" mat-icon-button (click)="close()" mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
  <iframe
    title="youtubeLink iframe"
    class="youtubeLink-iframe"
    [src]="autoplayUrl"
    style="border:none"
    allowfullscreen
    webkitallowfullscreen
    mozallowfullscreen
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture">
  </iframe>
</div>
