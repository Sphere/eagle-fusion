<div class="login-page-content">
  <div class="login-card">
    <div class="check-email-text mt-6"><span [innerHTML]="'Check your ' | translate"></span> <span [innerHTML]="'email' | translate"></span>
      <span [innerHTML]="'SMS' | translate"></span>!
    </div>
    <div class="enter-code-text mt-2 mb-4"><span [innerHTML]="'Enter the ' | translate"></span><span [innerHTML]="'Code' | translate"></span>
      <span [innerHTML]="'OTP' | translate"></span>
    </div>
    <div class="input-content">
      <div class="input-content-wrapper">
        <form [formGroup]="loginOtpForm" id="form-login" action="" method="post">
          <div class="form-group">
            <input tabindex="1" id="code" class="form-control input-box" formControlName="code" type="text"
              i18n-placeholder autocomplete="off" placeholder="{{emailPhoneType === 'email'? 'Code' : 'OTP'}}">
          </div>
          <div class="form-group mt-4 mb-4 activeLink">
            <span [innerHTML]="'Did not receive a ' | translate"></span><span [innerHTML]="'OTP?' | translate"></span><span [innerHTML]="'mail?' | translate"></span>
            <span [innerHTML]="' Click Here ' | translate"></span><span [innerHTML]="'to
              resend' | translate"></span>
          </div>
          <span>
            <button [innerHTML]="'Submit' | translate"></button>
          </span>
        </form>
      </div>
    </div>
  </div>
</div>
<div class="overlay" *ngIf="isLoading">
  <div class="loader-container">
    <div class="loader-ripple">
      <div></div>
      <div></div>
    </div>
  </div>
</div>
