<div [ngClass]="!isXSmall() ? 'program-banner': 'program-banner-mob'" *ngIf="programConfig">
  <button *ngIf="showbackButton" (click)="backScreen()" mat-icon-button
    class="back-icon text-left"><mat-icon>chevron_left</mat-icon></button>
  <h1>
    {{selectedProgDet?.title}}
  </h1>
</div>
<div class="paddingView">

  <!-- ── Competency user: full-page loading shimmer ─────────────────────── -->
  <ng-container *ngIf="isLoading() && !isCompetencyUser()">
    <div class="top-course-container content" *ngFor="let i of [1, 2, 3]">
      <section class="mt-4 view-all-course-container">
        <!-- Header -->
        <div class="line-label flex scroller-container">
          <span class="shimmer shimmer-line shimmer-header"></span>
          <button *ngIf="!isXSmall()" class="view-all-course shimmer-button shimmer">
            <span class="shimmer shimmer-line"></span>
          </button>
        </div>

        <!-- Cards -->
        <div class="horizontal-shimmer">
          <div class="shimmer-card" *ngFor="let j of [1, 2, 3, 4]">
            <div class="shimmer shimmer-image">
              <div class="shimmer-body">
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </ng-container>

  <!-- ── Competency learning path ───────────────────────────────────────── -->
  <ng-container *ngIf="!isLoading() && isCompetencyUser()">
    <app-competency-course-list [playlists]="competencyPlaylists()" [designation]="competencyDesignation"
      [role]="competencyRole" [section]="competencySection" [autoInit]="true">
    </app-competency-course-list>
  </ng-container>

  <!-- ── Standard carousel (non-competency users) ──────────────────────── -->
  <ng-container *ngIf="!isLoading() && !isCompetencyUser()">
    <section *ngIf="ashaLearningItems()?.length > 0"
      class="ml-2 mr-2 mt-4 view-all-course-container asha-learning-section">
      <div class="line-label flex scroller-container">
        <span class="header0">{{ 'COMPETENCIES' | translate }}</span>
      </div>
      <ws-utils-horizontal-scroller *ngIf="!isXSmall()" class="asha-learning-scroller" [loadStatus]="'done'">
        <div *ngFor="let competency of ashaLearningItems()">
          <ws-asha-learning-card [competency]="competency" [expanded]="expandedCardId === competency?.id"
            (expandedChange)="onCardExpanded(competency?.id, $event)"></ws-asha-learning-card>
        </div>
      </ws-utils-horizontal-scroller>
      <div *ngIf="isXSmall()" class="asha-learning-list">
        <div *ngFor="let competency of ashaLearningItems()">
          <ws-asha-learning-card [competency]="competency" [expanded]="expandedCardId === competency?.id"
            (expandedChange)="onCardExpanded(competency?.id, $event)"></ws-asha-learning-card>
        </div>
      </div>
    </section>
    <div class="top-course-container content" *ngFor="let content of uiConfig(); let i = index;">
      <section *ngIf="content?.show && content?.data && content?.data?.length>0"
        class="mt-4 view-all-course-container {{content?.scrollEmit}}" #scrollToCneCourses
        [attr.data-scroll]="content?.scrollEmit">
        <div [ngClass]="i === 0 || (isXSmall() && i === 1) ? 'bg-green' : 'orange'"
          class="line-label flex scroller-container">
          <span [ngClass]="{'header0': i == 0 || isXSmall() && i == 1}" [class]="content.headerClass">
            {{ content.title | translate }}</span>
          <button *ngIf="!isXSmall()" (click)="viewAllCourse(content)" class="view-all-course">
            {{ content?.button?.label1 | translate }} <img class="right-arrow" [src]="content?.button?.img" alt="" />
          </button>
        </div>
        <ws-utils-horizontal-scroller *ngIf="!isXSmall()" class="flex " [loadStatus]="'done'">
          <div *ngFor="let course of content?.data">
            <ng-container *ngIf="content.data && content.data.length>0">
              <ws-web-course-card [displayConfig]="content?.displayConfigWeb"
                [courseData]="course"></ws-web-course-card>
            </ng-container>
          </div>
        </ws-utils-horizontal-scroller>
        <ng-container *ngIf="isXSmall()">
          <div *ngFor="let course of content?.displayData">
            <ws-mobile-course-view [displayConfig]="content?.displayConfig"
              [courseData]="course"></ws-mobile-course-view>
          </div>
          <button *ngIf="content?.data?.length > content.limit" (click)="viewAllCourse(content)"
            class="view-all-course">
            {{ content?.data?.length == content?.displayData.length ? (content?.button?.label2 | translate) :
            (content?.button?.label1 | translate) }}
            <img class="bottom-arrow" [src]="content?.button?.img" alt="" />
          </button>
        </ng-container>
      </section>

      <div *ngIf="(content?.data?.length == 0 && content?.fallbackState?.label)" class="mt-4 view-all-course-container">
        <div [ngClass]="i === 0 || (isXSmall() && i === 1) ? 'bg-green' : 'orange'"
          class="line-label flex scroller-container">
          <span [ngClass]="{'header0': i == 0 || isXSmall() && i == 1}" [class]="content.headerClass">
            {{ content.title | translate }}</span>
        </div>
        <h3 class="mt15">{{ content?.fallbackState?.label | translate }}</h3>
      </div>
    </div>
  </ng-container>

</div>
