<div class="top-course-container content" *ngFor="let content of configData let i = index;">
  <section class="mt-4 view-all-course-container" *ngIf="content?.show && content?.data && content?.data?.length>0">
    <div [ngClass]="i === 0 || ((isXSmall$ | async) == true && i === 1) ? 'bg-green' : 'orange'"
      class="line-label flex scroller-container">
      <span [ngClass]="{'header0': i == 0 || (isXSmall$ | async) == true && i == 1}" [class]="content.headerClass">
        {{ content.title | translate }}</span>
      <button *ngIf="(isXSmall$ | async) === false" (click)="viewAllCourse(content)" class="view-all-course">
        {{ content?.button?.label1 | translate }} <img class="right-arrow" [src]="content?.button?.img" alt="" />
      </button>
    </div>
    <ws-utils-horizontal-scroller *ngIf="(isXSmall$ | async) === false" class="flex " [loadStatus]="'done'">
      <div *ngFor="let course of content?.data">
        <ng-container *ngIf="content.data && content.data.length>0">
          <ws-web-course-card [displayConfig]="content?.displayConfigWeb" [courseData]="course"></ws-web-course-card>
        </ng-container>
      </div>
    </ws-utils-horizontal-scroller>
    <ng-container *ngIf="(isXSmall$ | async) === true">
      <div *ngFor="let course of content?.displayData">
        <ws-mobile-course-view [displayConfig]="content?.displayConfig" [courseData]="course"></ws-mobile-course-view>
      </div>
      <button *ngIf="content?.data?.length > content.limit" (click)="viewAllCourse(content)" class="view-all-course">
        {{ content?.data?.length == content?.displayData.length ? (content?.button?.label2 | translate) :
        (content?.button?.label1 | translate) }}
        <img class="bottom-arrow" [src]="content?.button?.img" alt="" />
      </button>
    </ng-container>
  </section>
</div>
