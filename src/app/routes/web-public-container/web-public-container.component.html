<div class="top-course-container content" *ngFor="let content of configData">
  <section class="mt-4 view-all-course-container" *ngIf="content.data && content.data.length>0">
    <div class="line-label orange flex scroller-container">
      <div>
        <span class="header1">{{ content.title | translate }}</span>
      </div>
      <button (click)="viewAllCourse(content?.button.courseType)" class="view-all-course">
        {{ content?.button?.label | translate }} <img class="right-arrow" [src]="content?.button?.img" alt="" />
      </button>

    </div>
    <ws-utils-horizontal-scroller class="flex " [loadStatus]="'done'">
      <div *ngFor="let course of content.data">
        <ng-container *ngIf="content.data && content.data.length>0">
          <ws-web-course-card [displayConfig]="content?.displayConfig" [courseData]="course"></ws-web-course-card>
        </ng-container>
      </div>
    </ws-utils-horizontal-scroller>
  </section>
</div>

<!-- Top CNE courses -->
<section #scrollToCneCourses class="scrollToCneCourses mt-4 view-all-course-container"
  *ngIf="cneCourse && cneCourse.length>0&&!isEkshamata">
  <div class="line-label orange flex scroller-container">
    <span class="header1">{{ 'CNE COURSES' | translate }}</span>

    <button (click)="viewAllCourse()" class="view-all-course">
      {{ 'View all' | translate }} <img class="right-arrow" src="/fusion-assets/icons/Arrowpng.png" alt="" />
    </button>
  </div>
  <ws-utils-horizontal-scroller class="flex " [loadStatus]="'done'">
    <div *ngFor="let course of cneCourse">
      <ng-container *ngIf="cneCourse && cneCourse.length>0">
        <ws-web-course-card [cnePoints]="'yes'" [displayConfig]="CNECourseDisplayConfig"
          [courseData]="course"></ws-web-course-card>
      </ng-container>
    </div>
  </ws-utils-horizontal-scroller>
</section>
<div class="overlay" *ngIf="isLoading">
  <div class="loader-container">
    <div class="loader-ripple">
      <div></div>
      <div></div>
    </div>
  </div>
</div>
