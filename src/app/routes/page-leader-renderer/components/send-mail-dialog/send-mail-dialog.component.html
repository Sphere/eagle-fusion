<h1 mat-dialog-title>Send Message</h1>
<div mat-dialog-content>
  <form #sendMailForm="ngForm" (submit)="sendMail(sendMailForm)">
    <mat-form-field>
      <textarea required [placeholder]="data?.placeholder" minlength="10" [disabled]="mailSendInProgress" rows="4"
        [(ngModel)]="mailBodyText" matInput name="answer" #mailBody="ngModel"></textarea>
      <mat-error [innerHTML]="' Min length should be 10 characters ' | translate"></mat-error>
    </mat-form-field>
    <!-- <ws-spinner *ngIf="mailSendInProgress" [spinSize]="'small'" [spinWidth]="'thin'" [spinColor]="'primary'"
      class="margin-top-xs"></ws-spinner> -->
    <mat-spinner *ngIf="mailSendInProgress"></mat-spinner>
    <div class="flex flex-row-reverse margin-top-s">
      <button [innerHTML]="'
        Send Mail
      ' | translate"></button>
      <button mat-button type="reset">{{ 'Reset' | translate }}</button>
    </div>
  </form>
</div>
<input type="hidden" aria-value value="Your message will be conveyed to the leader." #successToast />
<input type="hidden" aria-value value="Unable to send message. Please try again." #errorToast />
<input type="hidden" aria-value value="Unable to send message as there are no valid ids." #noValidIdsToast />
