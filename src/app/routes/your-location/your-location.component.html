<div class="login-page-content" *ngIf="!yourBackground">
  <div class="login-card">

    <div class="create-acct-text mb-4" name="location-detail-heading"><span>{{ 'Tell us more about you' | translate
        }}</span>
      <p style="font-size: 16px;">{{ 'and unlock access to multiple courses' | translate }}</p>
    </div>

    <div class="img-box">
      <img alt="logo" width="155" height="105" src="../../../fusion-assets/images/about-you.png">
    </div>

    <div class="input-content">
      <div class="input-content-wrapper">

        <form [formGroup]="aboutYouForm">

          <!--<div class="form-group mt-4 input-box  d-none">
            <input [matDatepicker]="picker" [min]="minDate" [max]="maxDate" formControlName="dob"
              autocomplete="off" (dateInput)="onDateChange($event.value)" placeholder="Date of Birth" name="dob"
              id="dob-inputfield" class="form-control dob-input" (click)="picker.open()" readonly>
            <mat-datepicker-toggle [for]="picker" id="datepicker-icon"></mat-datepicker-toggle>
            <mat-datepicker #picker [startAt]="startDate"></mat-datepicker>
          </div>
          <div>
            <pre *ngIf="invalidDob" class="text-danger">You must be at least 18 years old</pre>
          </div> -->
          <!-- dropdown dob -->
          <h3 class="mb-1 label" for="dob">{{ 'Date of Birth' | translate }}</h3>
          <div class="form-group ">
            <!-- <lable>Date of Birth</lable> -->
            <ws-dropdown-dob (dobValue)="dobData($event)" [dob]="" [dateType]="dob"></ws-dropdown-dob>
          </div>
          <div>
            <pre *ngIf="invalidDob" class="text-danger">{{ 'You must be at least 18 years old' | translate }}</pre>
          </div>

          <h3 class="mb-1 label">{{ 'Your Location' | translate }}</h3>
          <div class="form-group input-box ">
            <select id="country" formControlName="country" class="form-control select-box" name="country-input-field"
              (change)="countrySelect($event)">
              <option [value]=null disabled>{{ 'Country' | translate }}</option>
              <option *ngFor="let country of countries" [value]="country.name">{{ country.name }}</option>
            </select>
          </div>

          <div class="form-group input-box">
            <select id="state" formControlName="state" class="form-control select-box" name="state-input-field"
              (change)="stateSelect($event)" [attr.disabled]="selectDisable ? 'disabled' : null">
              <option [value]=null disabled>{{ 'State' | translate }}</option>
              <option *ngFor="let state of states" [value]="state.name">{{ state.name }}</option>
            </select>
          </div>

          <div class="form-group input-box">
            <select id="distict" formControlName="distict" class="form-control select-box" name="distict-input-field"
              [attr.disabled]="selectDisable ? 'disabled' : null" (change)="disableNextBtn()">
              <option [value]=null disabled>{{ 'City/Distict' | translate }}</option>
              <option *ngFor="let distict of disticts" [value]="distict">{{ distict }}</option>
            </select>
          </div>

          <div class="next-btn-div">
            <button class="form-group login-button" name="login" type="submit" id="next-btn"
              [disabled]="!aboutYouForm?.valid || nextBtnDisable " (click)="onsubmit()">{{ 'Next' | translate
              }}</button>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>
<!-- About You Form Close-->

<div *ngIf="yourBackground">
  <ws-your-background [aboutYou]="aboutYouForm"></ws-your-background>
</div>
