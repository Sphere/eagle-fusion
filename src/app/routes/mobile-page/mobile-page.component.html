<div>
  <ws-mobile-home></ws-mobile-home>
</div>


<section class="mt-2 py-1 px-4" *ngIf="topCertifiedCourse && topCertifiedCourse.length>0">
  <div class="line-label orange">
    <span class="header1 ">{{ 'Top Courses' | translate }}</span>
  </div>

  <div *ngFor="let course of getDisplayedItems(topCertifiedCourse, showAllTopCertifiedCourses)">
    <ws-mobile-course-view [displayConfig]="topCertifiedCourseDisplayConfig"
      [courseData]="course"></ws-mobile-course-view>
  </div>

  <button *ngIf="topCertifiedCourse.length > 5" (click)="viewAllItems('topCertifiedCourses')" class="view-all-course">
    {{ showAllTopCertifiedCourses ? ('Hide' | translate) : ('View all' | translate) }}
    <img class="bottom-arrow" src="/fusion-assets/icons/Arrow_2.png" alt="" />
  </button>
</section>

<section #scrollToCneCourses id="scrollToCneCourses" class="scrollToCneCourses" class="py-1 px-4"
  *ngIf="cneCourse && cneCourse.length>0">
  <div class="line-label orange">
    <span class="header1 cne-text ">{{ 'CNE Courses' | translate }}</span>
  </div>
  <div *ngFor="let course of getDisplayedItems(cneCourse, showAllCneCourses)">
    <ws-mobile-course-view [displayConfig]="topCNECourseDisplayConfig" [cnePoints]="'yes'"
      [courseData]="course"></ws-mobile-course-view>
  </div>
  <button *ngIf="cneCourse.length > 5" (click)="viewAllItems('cneCourses')" class="view-all-course">
    {{ showAllCneCourses ? ('Hide' | translate) : ('View all' | translate) }}
    <img class="bottom-arrow" src="/fusion-assets/icons/Arrow_2.png" alt="" />
  </button>
</section>

<div class="mx-4">

  <section class="mt-4 mb-4">
    <ws-mobile-trusted-by-page></ws-mobile-trusted-by-page>
  </section>

  <!--50+ organization-->
  <section class="mt-4 mb-4" [hidden]="true">
    <ws-mobile-organization></ws-mobile-organization>
  </section>

</div>
<div class="content bg-green">
  <!-- How does it work section -->
  <section class="mt-4">
    <ws-how-does-work [config]="videoData"></ws-how-does-work>
  </section>
</div>
