<div class="close1">
  <button mat-button (click)="closeClick()">
    <img src="../../../fusion-assets/icons/close-vector.png" alt="icon">
  </button>
</div>

<div class="mt-2">
  <p class="header2">{{ 'About' | translate }}</p>

  <form [formGroup]="aboutForm" class="mt-2">

    <mat-form-field appearance="outline" class="py-1 textfield">
      <textarea matInput [matTextareaAutosize] [matAutosizeMaxRows]="5" [matAutosizeMinRows]="3" formControlName="about"
        [placeholder]="'About' | translate" #about></textarea>
      <mat-hint>{{ about.value.length }} / <span>{{ '500 characters' | translate }}</span></mat-hint>
      <mat-error *ngIf="aboutForm.controls['about'].touched && aboutForm.controls['about'].hasError('required')">
        About field is required
      </mat-error>
      <mat-error *ngIf="aboutForm.controls['about'].touched && aboutForm.controls['about'].hasError('maxLength')">
        {{ 'You have exceeded 500 characters.' | translate }}
      </mat-error>
    </mat-form-field>
    <button type="submit" (click)="onSubmit(aboutForm)" class="save-btn" [disabled]="!aboutForm?.valid">{{ 'Save' |
      translate }}</button>
  </form>
  <input type="hidden" i18-value i18-aria-value aria-value="User profile details update successful"
    value="User profile details updated successfully!" #toastSuccess />
</div>
