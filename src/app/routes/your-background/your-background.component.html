<div class="login-page-content" *ngIf="!almostDone">
  <div class="login-card">
    <h1 id="choose-bg-heading">{{ 'Choose your background' | translate }}</h1>
    <div class="content">
      <div class="content-wrapper" *ngFor="let img of professions; let i = index">
        <div class="column" (click)="imgSelect(img)" tabindex="-1">
          <a>
            <h4>{{img.name | translate}}</h4>
            <img [src]="img.image" height="80" alt="{{img.name | translate}}" />
          </a>
        </div>
      </div>
    </div>
    <!--     <div class="next-btn-div">
      <button class="form-group login-button" name="login" type="submit" (click)="onsubmit()" id="next-btn"
        [disabled]="nextBtnDisable">
        {{ 'Next' | translate }}</button>
    </div> -->
  </div>
</div>

<div *ngIf="almostDone">
  <ws-almost-done [yourBackground]='aboutYou' [backgroundSelect]='bgImgSelect' (redirectToParent)="changeBackgroung()">
  </ws-almost-done>
</div>
