<div style="background-image:url('/fusion-assets/images/Group-people.png')" *ngIf="!createAcc"
  class="flex footer-container">
  <div [innerHTML]="'
    Transform your Healthcare career through Sphere!
  ' | translate"></div>
  <button [innerHTML]="'Start Today' | translate"></button>
</div>
<div class="flex-container">
  <div class="part-a-partner center-partner">
    <div [innerHTML]="'
      An initiative of
    ' | translate"></div>
    <div class="flex-prop">
      <img class="part-a-img" src="/fusion-assets/icons/nike.png" alt="Card image cap">
    </div>
  </div>
  <div class="part-b-partner center-partner">
    <div [innerHTML]="'
      A collaboration with
    ' | translate"></div>
    <div class="flex-prop">
      <img class="part-b-img" src="/fusion-assets/icons/sci.png" alt="Card image cap">
    </div>
  </div>
</div>

<div class="flex flex-column ">
  <img class="footer-logo" src="/fusion-assets/images/sphere-new-logo.svg">
  <div class="flex flex-column link-container">
    <a [innerHTML]="'Quick Links' | translate"></a>
    <a [innerHTML]="'Privacy policy ' | translate"></a>
    <a [innerHTML]="'Terms of use' | translate"></a>
    <!-- <hr class="new1"> -->
    <a [innerHTML]="'Help and Contact' | translate"></a>
    <a class="link-text" href="mailto:support@aastrika.org">support@aastrika.org</a>
    <a class="whatsapp-logo-container" href="https://wa.me/919632013414?text=Hi" target="_blank">
      <img class="fa fa-whatsapp whatsapp-logo" src="/fusion-assets/icons/whatsapp.png" />
      Talk to us on WhatAapp
    </a>
    <!-- <hr class="new1"> -->
    <div class="flex flex-column">
      <span [innerHTML]="'Additional Links' | translate"></span>
      <div class="foundation-link"> <span [innerHTML]="'Aastrika Foundation ' | translate"></span> : <a target="_blank"
          class="foundation-text" href="https://www.aastrika.org/">
          https://www.aastrika.org/
        </a></div>
    </div>
    <div class="footer-social-icon">
      <a class="" href="https://twitter.com/aastrika_fndn?s=21&t=I9xN5rzMahavP0R1Fp7VwA" target="_blank">
        <img class="fa fa-whatsapp social-logo" src="../../../fusion-assets/icons/icons8-twitter.svg" />
      </a>
      <a class="" href="https://www.facebook.com/aastrikasphere?mibextid=LQQJ4d" target="_blank">
        <img class="fa fa-whatsapp social-logo" src="../../../fusion-assets/icons/icons8-facebook.svg" />
      </a>
      <a class="" href="https://instagram.com/sphere.aastrika?igshid=MmJiY2I4NDBkZg==" target="_blank">
        <img class="fa fa-whatsapp social-logo" src="../../../fusion-assets/icons/icons8-instagram.svg" />
      </a>
      <a class="" href="https://www.linkedin.com/company/aastrika-foundation/" target="_blank">
        <img class="fa fa-whatsapp social-logo" alt="aastrika-foundation"
          src="../../../fusion-assets/icons/icons8-linkedin.svg" />
      </a>
    </div>
    <div class="footer-text-container">
      <div class="footer-text">
        &copy; <span [innerHTML]="'2024' | translate"></span>
        <span [innerHTML]="'AastarUrmika Health Systems (&quot;Aastrika Foundation&quot;) ' | translate"></span>
      </div>
    </div>
  </div>
