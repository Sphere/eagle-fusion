<div class="tnc-container" id="tnc">
  <button (click)="backBtnClick()" mat-icon-button
    class="back-icon text-left"><mat-icon>chevron_left</mat-icon></button>
  <div *ngIf="showTerms==='terms'" class="mat-app-background padding-s margin-bottom-s">
    <h3 *ngIf="!generalTnc?.isAccepted" [innerHTML]="'
      Terms and Conditions have been updated.
    ' | translate"></h3>
    <!-- <div class="flex items-center justify-between">
      <div style="display: flex;flex-direction: column;" *ngIf="generalTnc?.version">
        <ng-container><span [innerHTML]="'Terms of use' | translate"></span></ng-container>
        <ng-container><span style="margin-left: -12px !important;margin-top: 10px;">T&C Version :{{
            generalTnc?.version }}
          </span></ng-container>
      </div>
    </div> -->
  </div>
  <article *ngIf="showTerms==='terms'" [innerHTML]="generalTnc?.content" class="text-justify"></article>
  <!-- <mat-action-row *ngIf="dpTnc === 'Data Privacy'">
    <button [innerHTML]="'
      View Privacy Policy
    ' | translate"></button>
    <button [innerHTML]="'
      Data Privacy
    ' | translate"></button>
  </mat-action-row> -->

  <div *ngIf="showTerms==='privacy'" class="mat-app-background padding-s margin-bottom-s">
    <h3>{{ '
      Data privacy has been upgraded.
      ' | translate }}</h3>
    <div class="flex items-center justify-between">

      <div *ngIf="dpTnc?.version">
        <ng-container [innerHTML]="'Data Privacy Version: ' | translate"></ng-container>
        <span class="ws-mat-primary-text">{{ dpTnc?.version }}</span>
      </div>

    </div>
  </div>
  <article *ngIf="showTerms==='privacy'" [innerHTML]="dpTnc?.content | pipeSafeSanitizer: 'html'" class="text-justify">
  </article>

</div>


<mat-menu #tncLangMenu="matMenu">
  <ng-container *ngIf="generalTnc">
    <button (click)="changeTncLang(lang)" mat-menu-item *ngFor="let lang of generalTnc?.availableLanguages">
      <mat-icon *ngIf="lang === generalTnc?.language"> radio_button_checked </mat-icon>
      <mat-icon *ngIf="lang !== generalTnc?.language"> radio_button_unchecked </mat-icon>
      <span>{{lang}}</span>
    </button>
  </ng-container>
</mat-menu>

<mat-menu #dpLangMenu="matMenu">
  <ng-container *ngIf="dpTnc">
    <button (click)="changeDpLang(lang)" mat-menu-item *ngFor="let lang of dpTnc?.availableLanguages">
      <mat-icon *ngIf="lang === dpTnc?.language"> radio_button_checked </mat-icon>
      <mat-icon *ngIf="lang !== dpTnc?.language"> radio_button_unchecked </mat-icon>
      <span>{{lang}}</span>
    </button>
  </ng-container>
</mat-menu>
