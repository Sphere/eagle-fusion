<form class="flex gap-3" [formGroup]="dobForm">
  <div class="form-group input-box ">
    <select id="{{dateType}}-year" formControlName="yearField" class="form-control select-box" name="date-input-field"
      aria-label="Year" (change)="countrySelect()">
      <option [value]="''" [selected]="'Year'" disabled selected>{{ 'Years' | translate }}</option>
      <option *ngFor="let years of yearsValue" [value]="years">{{ years }}</option>
    </select>
  </div>
  <div class="form-group input-box ">
    <select id="{{dateType}}-month" formControlName="monthField" class="form-control select-box" name="date-input-field"
      aria-label="Month" (change)="countrySelect()">
      <option [value]="''" [selected]="'Month'" disabled>{{ 'Month' | translate }}</option>
      <option *ngFor="let months of monthValue" [value]="months.id">{{ months.name }}</option>
    </select>
  </div>
  <div class="form-group input-box">
    <select id="{{dateType}}-date" formControlName="dateField" class="form-control select-box" name="date-input-field"
      aria-label="Date" (change)="countrySelect()">
      <option value="" disabled selected>{{'Date' | translate }}</option>
      <option *ngFor="let date of dateValue" [value]="date">{{ date }}</option>
    </select>
  </div>


</form>
