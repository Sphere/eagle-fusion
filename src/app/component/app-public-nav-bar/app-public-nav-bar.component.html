<mat-toolbar class="navbar-container" *ngIf="showPublicNavbar" [color]="navBar?.color" [ngStyle]="navBar?.styles">
  <a name="application-logo" class="padding-remove-small application-logo" routerLink="." i18n-matTooltip
    matTooltip="Home">
    <img loading="lazy" [src]="appIcon" id="app-logo" i18n-alt alt="Application Logo" class="app-logo"
      *ngIf=" (isXSmall$ | async) === false && appIcon" />
    <img loading="lazy" [src]="orgConfig?.foundationLogo" width="110px" height="65px"
      *ngIf=" (isXSmall$ | async) === false && !appIcon" />
    <img loading="lazy" [src]="orgConfig?.foundationLogo" width="110px" height="65px"
      *ngIf=" (isXSmall$ | async) === true" />
  </a>
  <div class="fix-ww">
    <ws-app-search-input-home *ngIf=" (isXSmall$ | async) === false" title="search" class="my-search flex-1"
      [ref]="'home'">
    </ws-app-search-input-home>
  </div>

  <div class="flex justify-end">
    <button *ngIf="this.configSvc.userProfile === null" name="login_client_button" color="primary" (click)="login('S')"
      [ngClass]="{'login-btn header-btn mat-button-base': (isXSmall$ | async) == false,
        'login-btn-xs': (isXSmall$ | async) == true }">
      {{orgConfig?.rightMenuItem?.title | translate}}</button>
    <!-- <button *ngIf="(isXSmall$ | async) === true && (this.configSvc.userProfile === null)" name="login_client_button"
      [ngStyle]="{'background-color': '#2E6491',  'width': '75px','height':'30px', 'border' :'1px solid #3f51b5', 'border-radius': '20px', 'color' : '#FFFFFF', 'font-size': 'small','justify-content':'center'}"
      mat-raised-button (click)="login('S')" class="login-btn-xs">
      {{orgConfig?.rightMenuItem?.title | translate }}
    </button> -->
  </div>
</mat-toolbar>
