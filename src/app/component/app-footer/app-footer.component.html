<div style="background-image:url('/fusion-assets/images/Group-people.png')" *ngIf="(isXSmall) === false && !isLoggedIn"
  class="flex transform-footer-container">
  <div [innerHTML]="'
    Transform your Healthcare career through Sphere!
  ' | translate"></div>
  <button [innerHTML]="'Start Today' | translate"></button>
</div>
<div *ngIf="(isXSmall) === false && !isLoggedIn" class="flex-container">
  <div class="part-a-partner center-partner">
    <div [innerHTML]="'
      An initiative of
    ' | translate"></div>
    <div class="flex-prop">
      <img class="part-a-img" src="/fusion-assets/icons/nike.png" alt="Card cap">
    </div>
  </div>
  <div class="part-b-partner center-partner">
    <div [innerHTML]="'
      A collaboration with
    ' | translate"></div>
    <div class="flex-prop">
      <img class="part-b-img" src="/fusion-assets/icons/sci.png" alt="Card cap">
    </div>
  </div>
</div>

<div class="mat-toolbar mat-ws-mat-primary-text footer-container pb-0 sm:px-48 md:px-10ss">

  <div class="mat-body  footer-flex mb-4" [ngClass]="{'flex w-full': !isXSmall && !isMedium}">
    <div [ngClass]="{'flex': !isXSmall}" class="footer-first-col">
      <mat-list class="list" [ngClass]="{'ml-12': !isXSmall}">
        <mat-list-item *ngIf="isEkshamata"> <span class="link-header"> In
            collaboration with
          </span></mat-list-item>
        <mat-list-item style="margin-top: 10px; height: 60px !important;">
          <img class=" footer-aastar-logo" loading="lazy" [src]="appIcon" alt="Angular icon" id="footer-aastar-logo">
        </mat-list-item>
      </mat-list>
      <mat-list *ngIf="isEkshamata" class="list mt-10" [ngClass]="{'ml-12': !isXSmall}">
        <mat-list-item><span class="link-header"> Quick Links </span></mat-list-item>
        <mat-list-item style="margin-top: 10px;">
          <a [innerHTML]="'
            My Course
          ' | translate"></a>
        </mat-list-item>
        <mat-list-item style="margin-top: 10px;">
          <a [innerHTML]="'
            Competency
          ' | translate"></a>
        </mat-list-item>
        <mat-list-item style="margin-top: 10px;">
          <a [innerHTML]="'
            Account
          ' | translate"></a>
        </mat-list-item>
      </mat-list>

      <mat-list class="list mt-10" [ngClass]="{'ml-12': !isXSmall}">
        <mat-list-item *ngIf="isEkshamata"> <span class="link-header"> Policies </span> </mat-list-item>
        <mat-list-item *ngIf="!isEkshamata"> <span class="link-header"> Quick Links </span></mat-list-item>
        <mat-list-item>
          <a routerLink="/public/tnc" [queryParams]="{panel: 'dp'}">
            <span class="list-item"> Privacy policy</span>
          </a>
        </mat-list-item>
        <mat-list-item>
          <a routerLink="/public/tnc" [queryParams]="{panel: 'tnc'}">
            <span class="list-item">Terms of Use</span>
          </a>
        </mat-list-item>
      </mat-list>

      <mat-list class="list mt-10" [ngClass]="{'ml-12': !isXSmall}">
        <mat-list-item>
          <a [innerHTML]="'Help & Contact ' | translate"></a>
          <a [innerHTML]="'Help & Contact ' | translate"></a>
        </mat-list-item>
        <!-- <mat-list-item> <a [innerHTML]="'Blog' | translate"></a> </mat-list-item> -->
        <mat-list-item *ngIf="!isEkshamata" style="margin-top: 10px;">
          <a [innerHTML]="'support@aastrika.org' | translate"></a>
        </mat-list-item>
        <mat-list-item *ngIf="isEkshamata&&configSvc.hostedInfo?.phone" style="margin-top: 10px;">
          <a class="link-text">{{configSvc.hostedInfo.phone}}</a>
        </mat-list-item>
        <mat-list-item style="margin-top: 10px;">
          <a *ngIf="!isEkshamata" class="whatsapp-logo-container" href="https://wa.me/919632013414?text=Hi"
            target="_blank">
            <img alt="whatsapp" class="fa fa-whatsapp whatsapp-logo" src="/fusion-assets/icons/whatsapp.png" />
            Talk to us on WhatsApp
          </a>
        </mat-list-item>
        <!-- <mat-list-item style="margin-top: 20px;"> -->
        <!-- <p class="mat-subheading-2 flex flex-middle">
            <img src="/fusion-assets/icons/lang-icon.png" width="35" height="24px" />
            <ng-container [innerHTML]="'Choose your Language' | translate"></ng-container>
          </p> -->
        <!--       <mat-form-field> -->
        <!-- <label [innerHTML]="'Choose your Language' | translate"></label>
          <div class="d-inline" style="margin-top: -5px; font-size: small;">
            <a (click)="langRedirect('')" class="languages">English</a>
            <a (click)="langRedirect('hi')" class="languages">हिन्दी</a>
          </div> -->
        <!--     </mat-form-field> -->
        <!-- </mat-list-item> -->
      </mat-list>
      <mat-list *ngIf="isEkshamata" class="list mt-10" [ngClass]="{'ml-12': !isXSmall}">
        <mat-list-item> <a [innerHTML]="'Experience e-kshamata app on
            mobile ' | translate"></a>
        </mat-list-item>
        <div class="flex" style="gap: 10px;">
          <mat-list-item style="margin-top: 10px;">
            <a href="https://play.google.com/store/apps/details?id=org.aastrika.ekshamata" target="_blank">
              <img alt="google play" src="/fusion-assets/images/google_play.svg" width="150" height="50" />
            </a>
          </mat-list-item>
          <mat-list-item style="margin-top: 10px;">
            <a href="https://apps.apple.com/in/app/e-kshamata/id6505063333" target="_blank">
              <img alt="app store" src="/fusion-assets/images/app_store.svg" width="150" height="50" />
            </a>
          </mat-list-item>
        </div>
      </mat-list>

      <mat-list *ngIf="!isEkshamata" class="list mt-10" [ngClass]="{'ml-12': !isXSmall}">
        <mat-list-item> <span class="link-header"> Additional Links </span> </mat-list-item>
        <mat-list-item class="foundation-container" style="margin-top: 10px;"><span
            [innerHTML]="'Aastrika Foundation ' | translate"></span>:
          <a target="_blank" class="list-item-link" href="https://www.aastrika.org/">
            https://www.aastrika.org/
          </a>
        </mat-list-item>
        <mat-list-item class="social-logo-container">
          <a class="social-logo-block" href="https://twitter.com/aastrika_fndn?s=21&t=I9xN5rzMahavP0R1Fp7VwA"
            target="_blank">
            <img alt="twitter" class="fa fa-whatsapp social-logo"
              src="../../../fusion-assets/icons/icons8-twitter.svg" />
          </a>
          <a class="social-logo-block" href="https://www.facebook.com/aastrikasphere?mibextid=LQQJ4d" target="_blank">
            <img alt="facebook" class="fa fa-whatsapp social-logo"
              src="../../../fusion-assets/icons/icons8-facebook.svg" />
          </a>
          <a class="social-logo-block" href="https://instagram.com/sphere.aastrika?igshid=MmJiY2I4NDBkZg=="
            target="_blank">
            <img alt="instagram" class="fa fa-whatsapp social-logo"
              src="../../../fusion-assets/icons/icons8-instagram.svg" />
          </a>
          <a class="social-logo-block" href="https://www.linkedin.com/company/aastrika-foundation/" target="_blank">
            <img alt="linkedin" class="fa fa-whatsapp social-logo"
              src="../../../fusion-assets/icons/icons8-linkedin.svg" />
          </a>
        </mat-list-item>
      </mat-list>
    </div>
  </div>
</div>

<footer class="docs-footer px-4 pt-0 sm:px-8 md:px-10ss">
  <div [ngClass]="{'docs-footer-list': !isXSmall}">
    <!-- <div class="docs-footer-version">
    </div> -->
    <div class="docs-footer-copyright flex-1">
      <div>
        <div *ngIf="!isEkshamata" class="footer-alignment">&copy; <span [innerHTML]="'2024' | translate"></span>
          <span [innerHTML]="'AastarUrmika Health Systems (&quot;Aastrika Foundation&quot;) ' | translate"></span>
        </div>
        <div *ngIf="isEkshamata" class="footer-alignment">
          &copy; <span style="margin-right: 3px;">{{ currentYear }}</span>
          <span [innerHTML]="'Aastrika Foundation - a section 8 company under the Companies Act, 2013, formerly known as
            AastarUrmika Health Systems Pvt. Ltd. All rights reserved.' | translate"></span>
        </div>
      </div>
    </div>
  </div>
</footer>
