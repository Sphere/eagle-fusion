<!-- For Sphere user -->
<div class="NotEkshamata" *ngIf="!isEkshamata" [ngClass]="!isCommonChatEnabled ? 'blur-screen' : ''">
  <mat-progress-bar mode="indeterminate" color="warn" class="route-change" *ngIf="routeChangeInProgress">
  </mat-progress-bar>
  <!-- before login -->
  <ws-app-public-nav-bar *ngIf="showNavigation && !hideHeaderFooter && !isLoggedIn && orgDetails"
    [orgConfig]="orgDetails"></ws-app-public-nav-bar>
  <!-- Logged-In header -->
  <ws-app-nav-bar class="top-nav-bar" *ngIf="isNavBarRequired && showNavbar" [mode]="'top'"></ws-app-nav-bar>

  <!-- dashboard and body for mobile and web-->
  <div class="height-adjust" [ngClass]="{
    'height-on-bottom custom-scroll': isXSmall$ && showNavbar,
      'height-adjust-setup': isSetupPage,
      'height-on-top': !isXSmall$ && showNavbar && isNavBarRequired
    }">
    <ws-dashboard class="mb-6" *ngIf="isLoggedIn && isHomePage && bodyConfig" [configData]="bodyConfig"></ws-dashboard>
    <!-- Featured Section-->
    <section *ngIf="isHomePage && isLoggedIn && bodyConfig">
      <ws-web-public-container [userEnrollCourse]="userEnrollCourse"
        [configData]="bodyConfig"></ws-web-public-container>
    </section>
    <router-outlet *ngIf="appOnline"></router-outlet>
    <div *ngIf="!appOnline" style="text-align: center;">
      <h3 class="mt-15">{{ "You're offline. Check your internet connection" | translate }}</h3>
    </div>
  </div>

  <!-- Featured Section-->
  <section *ngIf="isHomePage && !isLoggedIn && bodyConfig">
    <ws-web-public-container [userEnrollCourse]="userEnrollCourse" [configData]="bodyConfig"></ws-web-public-container>
  </section>

  <!-- How does it Works -->
  <ng-container *ngIf="isHomePage && configData">
    <ws-web-trusted-by-page *ngIf="!isLoggedIn" [config]="configData[4]"></ws-web-trusted-by-page>
    <div [ngClass]="{'mt-8': !isXSmall$}">
      <ws-how-does-work class="bg-color app-footer"
        [ngStyle]="{ 'padding-bottom: 56px': !isSetupPage, 'margin-top: 0.5rem': !isXSmall$}"
        *ngIf="showNavbar && !hideHeaderFooter && videoData" [config]="videoData"></ws-how-does-work>
    </div>
  </ng-container>

  <!-- Desktop Footer -->
  <ws-app-footer class="app-footer" [ngStyle]="{ 'padding-bottom: 56px': !isSetupPage}"
    *ngIf="showNavbar && !hideHeaderFooter && showNavigation">
  </ws-app-footer>

  <!-- bottom nav bar for mobile -->
  <ws-app-nav-bar class="bottom-nav-bar" *ngIf="isXSmall$ && !hideHeaderFooter" [mode]="'bottom'" [hidden]="!showNavbar"
    [authorised]="configSvc.isAuthenticated"></ws-app-nav-bar>

  <input #appUpdateTitle type="hidden" value="App Update" />
  <input #appUpdateBody type="hidden" value="App has been updated. Do you want to load new version?" />
</div>

<!-- for Ekshamata user -->
<div *ngIf="isEkshamata" [ngClass]="!isCommonChatEnabled ? 'blur-screen' : ''">
  <mat-progress-bar mode="indeterminate" color="warn" class="route-change" *ngIf="routeChangeInProgress">
  </mat-progress-bar>
  <ws-app-nav-bar class="top-nav-bar" *ngIf="isNavBarRequired&&isLoggedIn" [hidden]="!showNavbar"
    [mode]="'top'"></ws-app-nav-bar>
  <router-outlet *ngIf="appOnline"></router-outlet>
  <div class="height-adjust" [ngClass]="{'height-on-bottom custom-scroll':isXSmall$ && showNavbar,'height-adjust-setup' : isSetupPage,
        'height-on-top':!isXSmall$ &&showNavbar && isNavBarRequired}">
    <ws-dashboard [isEkshamata]="isEkshamata" class="mb-6" *ngIf="isLoggedIn&&isHomePage"></ws-dashboard>
    <router-outlet *ngIf="appOnline"></router-outlet>
    <div *ngIf="!appOnline" style="text-align: center;">
      <h3 class="mt-15">{{"You're offline. Check your internet connection" | translate }}</h3>
    </div>
    <!-- Featured Section-->
    <section *ngIf="!isXSmall$&&isHomePage">
      <ws-web-public-container [isEkshamata]="isEkshamata" [configData]="bodyConfig"
        [userEnrollCourse]="userEnrollCourse"></ws-web-public-container>
    </section>
    <!-- Desktop Footer -->
    <ws-app-footer [isEkshamata]="isEkshamata" class="app-footer" [ngStyle]="{ 'padding-bottom: 56px': !isSetupPage}"
      *ngIf="showNavbar && isLoggedIn && !hideHeaderFooter">
    </ws-app-footer>
    <ng-container>
      <ws-app-nav-bar class="bottom-nav-bar" *ngIf="isXSmall$ && !hideHeaderFooter" [mode]="'bottom'"
        [hidden]="!showNavbar" [authorised]="configSvc.isAuthenticated">
      </ws-app-nav-bar>
    </ng-container>
  </div>
</div>

<div *ngIf="!isCommonChatEnabled">
  <img src="/fusion-assets/images/cross.svg" (keydown)="handleKeyDown($event)" class="cross-icon" alt="cross"
    (click)="backToChatIcon()" />
  <a href="https://wa.me/919632013414?text=Hi" target="_blank">
    <img src="/fusion-assets/images/whatsapp-icon.svg" class="whatsapp-icon" alt="whatsapp" />
    <div>
      <p class="whtsapp-text">{{"Chat with us on WhatsApp" | translate }}</p>
    </div>
  </a>
  <button class="fcapp-text cursor-pointer" (click)="openFreshChat()">{{"Connect with us" | translate }}</button>
</div>
