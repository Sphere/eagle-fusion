<script>

  // window.addEventListener("load", (event) => {
  const url = window.location.href

  console.log("href", window.location.href)
  if (url.includes('token') && url.includes('moduleId')) {
    const sashakt_token = url.slice(url.indexOf('?token=') + 7, url.indexOf('&moduleId='))
    sessionStorage.setItem('sashakt_token', sashakt_token)
    const sashakt_moduleId = url.slice(url.indexOf('&moduleId=') + 10)
    sessionStorage.setItem('sashakt_moduleId', sashakt_moduleId)
    // const maternity_token = url.slice(url.indexOf('?token=') + 7, url.indexOf('&moduleId='))
    // sessionStorage.setItem('maternity_token', maternity_token)
    // const maternity_moduleId = url.slice(url.indexOf('&moduleId=') + 10)
    // sessionStorage.setItem('maternity_moduleId', maternity_moduleId)
  } else {
    if (url.includes('token')) {
      const maternity_token = url.slice(url.indexOf('?token=') + 7)
      sessionStorage.setItem('maternity_token', maternity_token)
      const tnnmc_token = url.slice(url.indexOf('?token=') + 7)
      sessionStorage.setItem('tnnmc_token', tnnmc_token)
      const tnai_token = url.slice(url.indexOf('?token=') + 7)
      sessionStorage.setItem('tnai_token', tnai_token)
      const mnc_userToken = url.slice(url.indexOf('?token=') + 7)
      sessionStorage.setItem('mnc_userToken', mnc_userToken)
    }
  }

</script>
